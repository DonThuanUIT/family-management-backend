spring:
  application:
    name: familyfund-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:familyfund_db}
    username: ${DB_USER:familyfund_user}
    password: ${DB_PASSWORD:familyfund_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25

  ai:
    vectorstore:
      pgvector:
        initialize-schema: false

server:
  port: 8080
