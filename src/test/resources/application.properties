# Test-classpath overrides (highest precedence over src/main/resources/application.yaml).
# US-08 background worker must never run during tests: the suites share a real PostgreSQL
# database, and a scan could insert task_progress_alerts rows outside the test transaction.
app.task.deadline-warning.enabled=false
# US-39: the inbox listener runs on the @Async executor, i.e. outside the test transaction, and would
# commit notification rows into the shared database. The listener is exercised directly by its own tests
# and by NotificationControllerIntegrationTest, so it stays disabled for the rest of the suite.
app.notification.inbox.enabled=false
# US-39: never talk to Firebase from tests; the logging adapter only writes to the log.
app.notification.push.provider=log
app.storage.cleanup-enabled=false
# Ordinary tests never contact the hosted Storage API; live tests opt in separately.
app.storage.supabase-url=https://storage.example.invalid
app.storage.supabase-service-key=sb_secret_unit_test
