services:
  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: familyfund-swagger
    restart: unless-stopped
    ports:
      - "${SWAGGER_PORT:-8082}:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./docker/swagger/openapi.yaml:/spec/openapi.yaml:ro
    networks:
      - familyfund-network

  adminer:
    image: adminer:latest
    container_name: familyfund-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8088}:8080"
    networks:
      - familyfund-network

networks:
  familyfund-network:
    driver: bridge
