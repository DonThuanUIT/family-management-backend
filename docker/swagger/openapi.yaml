openapi: 3.0.3
info:
  title: Family Management Fund API (familyfund-api)
  version: 1.0.0
  description: |
    Core RESTful API documentation for Family Management Backend system.
    Supports Family Tree Management, Event Planning & Registration, Advance/Settlement Vouchers,
    Immutable Ledgers (Audit Trail), and Multi-channel Contributions.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Spring Boot Backend Server
paths:
  /auth/register-creator:
    post:
      summary: Đăng ký tài khoản người khởi tạo & tạo dòng họ mới (US-01)
      description: |
        Khởi tạo tài khoản người dùng, tạo một dòng họ mới (Multi-tenant), dựng nhánh gốc (Root Branch)
        của cây phả hệ, tạo hồ sơ Thủy tổ (nếu có) và hồ sơ thành viên người khởi tạo với vai trò ROLE_CLAN_HEAD.
      tags:
        - Authentication
        - Clan & Family Tree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clanName
                - fullName
                - phoneNumber
                - password
                - gender
              properties:
                clanName:
                  type: string
                  example: Dòng họ Nguyễn Văn
                ancestorName:
                  type: string
                  example: Cụ Tổ Nguyễn Văn Khởi
                originLocation:
                  type: string
                  example: Hà Nam, Việt Nam
                establishedYear:
                  type: integer
                  example: 1820
                description:
                  type: string
                  example: Chi họ khởi tổ tại Hà Nam
                fullName:
                  type: string
                  example: Nguyễn Văn An
                phoneNumber:
                  type: string
                  example: "0987654321"
                password:
                  type: string
                  format: password
                  example: SecurePassword123
                gender:
                  type: string
                  enum: [Male, Female, Other]
                  example: Male
                email:
                  type: string
                  format: email
                  example: nguyenvanan@example.com
                dateOfBirth:
                  type: string
                  format: date
                  example: 1985-05-15
                generation:
                  type: integer
                  example: 6
      responses:
        '201':
          description: Đăng ký và khởi tạo dòng họ thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đăng ký người khởi tạo và tạo dòng họ mới thành công
                  data:
                    type: object
                    properties:
                      account:
                        type: object
                        properties:
                          accountId:
                            type: string
                            example: ACC_9A8B7C6D
                          phoneNumber:
                            type: string
                            example: "0987654321"
                          email:
                            type: string
                            example: nguyenvanan@example.com
                          accountStatus:
                            type: string
                            example: Active
                          roles:
                            type: array
                            items:
                              type: string
                            example: [ROLE_CLAN_HEAD]
                          createdAt:
                            type: string
                            format: date-time
                      clan:
                        type: object
                        properties:
                          clanId:
                            type: string
                            example: CLAN_F1E2D3C4
                          clanName:
                            type: string
                            example: Dòng họ Nguyễn Văn
                          ancestorName:
                            type: string
                            example: Cụ Tổ Nguyễn Văn Khởi
                          originLocation:
                            type: string
                            example: Hà Nam, Việt Nam
                          establishedYear:
                            type: integer
                            example: 1820
                          description:
                            type: string
                            example: Chi họ khởi tổ tại Hà Nam
                      member:
                        type: object
                        properties:
                          memberId:
                            type: string
                            example: MEM_4B3A2C1D
                          fullName:
                            type: string
                            example: Nguyễn Văn An
                          gender:
                            type: string
                            example: Male
                          generation:
                            type: integer
                            example: 6
                          dateOfBirth:
                            type: string
                            format: date
                            example: 1985-05-15
                          branchId:
                            type: string
                            example: BR_1234ABCD
        '400':
          description: Dữ liệu không hợp lệ hoặc số điện thoại / email đã tồn tại
  /auth/login:
    post:
      summary: Đăng nhập hệ thống
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginIdentifier
                - password
              properties:
                loginIdentifier:
                  type: string
                  example: admin_hoang
                password:
                  type: string
                  format: password
                  example: Admin@123
      responses:
        '200':
          description: Đăng nhập thành công, trả về JWT Token và thông tin tài khoản
        '401':
          description: Sai thông tin đăng nhập

  /clans:
    get:
      summary: Lấy danh sách dòng họ (Multi-tenant)
      tags:
        - Clan & Family Tree
      responses:
        '200':
          description: Danh sách dòng họ
    post:
      summary: Khởi tạo dòng họ mới
      tags:
        - Clan & Family Tree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clanName
              properties:
                clanName:
                  type: string
                  example: Dòng họ Nguyễn Trọng
                establishedDate:
                  type: string
                  format: date
                  example: 1850-01-01
                inviteCode:
                  type: string
                  example: CLAN-NGUYEN-1850
      responses:
        '201':
          description: Tạo thành công

  /clans/{clanId}/members:
    get:
      summary: Lấy danh sách thành viên trong dòng họ
      tags:
        - Clan & Family Tree
      parameters:
        - name: clanId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách thành viên

  /branches/{branchId}/members:
    post:
      summary: Tạo hồ sơ thành viên mới trong một chi/nhánh (US-03)
      description: |
        Tạo hồ sơ thành viên (`members`) gắn với chi/nhánh nêu trong đường dẫn, thuộc dòng họ hiện hành
        (multi-tenant: header `X-Clan-Id` hoặc query param `clanId`, mặc định `CLAN_DEFAULT`).

        Quy tắc nghiệp vụ:
        - `branchId` **chỉ** lấy từ đường dẫn, không truyền lại trong body.
        - `memberId` do server sinh (`MEM` + timestamp Base36 + hậu tố CSPRNG, tối đa 20 ký tự).
        - `isPlaceholder` luôn được server đặt `true` (hồ sơ chờ tài khoản người dùng nhận liên kết - US-18).
        - Chống trùng hồ sơ trong cùng dòng họ theo bộ (`fullName` không phân biệt hoa thường, `gender`, `generation`, `dateOfBirth`).
        - `generation` không được nhỏ hơn `generation_level` của chi/nhánh.
      tags:
        - Clan & Family Tree
      security:
        - BearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          description: Mã chi/nhánh thuộc dòng họ hiện hành (`family_branches.branch_id`, VARCHAR(20))
          schema:
            type: string
            maxLength: 20
            example: BR_CHILD_1
        - name: X-Clan-Id
          in: header
          required: false
          description: Mã dòng họ hiện hành (multi-tenant). Bỏ trống sẽ dùng `CLAN_DEFAULT`.
          schema:
            type: string
            example: CLAN_DEFAULT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: Tạo thành viên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMember'
        '400':
          description: Payload sai ràng buộc schema, `branchId` sai định dạng, hoặc thế hệ thấp hơn cấp của chi/nhánh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '403':
          description: Không có quyền (chỉ `ROLE_CLAN_HEAD`, `ROLE_BRANCH_HEAD`, `ROLE_ADMIN`; Trưởng chi chỉ được thêm vào chi mình quản lý)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Dòng họ hoặc chi/nhánh không tồn tại trong dòng họ hiện hành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '409':
          description: Hồ sơ trùng với thành viên đã có trong dòng họ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /events:
    get:
      summary: Danh sách sự kiện của dòng họ
      tags:
        - Events & Registration
      responses:
        '200':
          description: Danh sách sự kiện
    post:
      summary: Khởi tạo kế hoạch sự kiện mới (US-21)
      tags:
        - Events & Registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventName
                - eventDatetime
                - location
              properties:
                eventName:
                  type: string
                  example: Giỗ Tổ 2026
                eventDatetime:
                  type: string
                  format: date-time
                  example: "2026-04-26T08:00:00Z"
                eventDateLunar:
                  type: string
                  example: "10/03 Bính Ngọ"
                location:
                  type: string
                  example: Nhà thờ tổ Chi 1
                estimatedBudget:
                  type: number
                  example: 50000000.00
                description:
                  type: string
                  example: Lễ giỗ tổ truyền thống dòng họ
      responses:
        '201':
          description: Tạo sự kiện thành công

  /events/{eventId}:
    get:
      summary: Xem chi tiết sự kiện và ban tổ chức (US-21)
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT_20260426
      responses:
        '200':
          description: Chi tiết sự kiện
    put:
      summary: Cập nhật thông tin và lịch trình sự kiện (US-22)
      description: |
        Cập nhật thông tin sự kiện. Tự động so sánh lịch trình cũ và mới (ngày giờ, địa điểm) để phát thông báo biến động tới con cháu.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventName
                - eventDatetime
                - location
              properties:
                eventName:
                  type: string
                  example: Giỗ Tổ 2026 (Điều chỉnh)
                eventDatetime:
                  type: string
                  format: date-time
                  example: "2026-04-27T08:00:00Z"
                eventDateLunar:
                  type: string
                  example: "11/03 Bính Ngọ"
                location:
                  type: string
                  example: Từ đường Đại Tộc
                estimatedBudget:
                  type: number
                  example: 55000000.00
                description:
                  type: string
                  example: Cập nhật địa điểm sang từ đường lớn
      responses:
        '200':
          description: Cập nhật thông tin sự kiện thành công

  /events/{eventId}/status:
    patch:
      summary: Chuyển đổi trạng thái vòng đời sự kiện (US-21)
      description: |
        Quản lý chuyển đổi trạng thái vòng đời: Draft -> RegistrationOpen -> RegistrationClosed -> Ongoing -> Ended -> Closed.
        Được bảo vệ bởi @PreAuthorize("hasAnyRole('CLAN_HEAD', 'ADMIN') or @nhanSuSuKien.xacThucQuyenTheoNguCanh(#eventId, 'HeadOfOrganizer')").
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Draft, RegistrationOpen, RegistrationClosed, Ongoing, Ended, Closed]
                  example: RegistrationOpen
      responses:
        '200':
          description: Cập nhật trạng thái sự kiện thành công

  /events/{eventId}/personnel:
    post:
      summary: Chỉ định Ban tổ chức và Thủ quỹ sự kiện (US-21)
      description: |
        Trưởng tộc chỉ định nhân sự gắn riêng với sự kiện. Ràng buộc: tối đa 1 HeadOfOrganizer, 1 EventTreasurer, không giới hạn OrganizerMember.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - personnel
              properties:
                personnel:
                  type: array
                  items:
                    type: object
                    required:
                      - memberId
                      - role
                    properties:
                      memberId:
                        type: string
                        example: MEM_001
                      role:
                        type: string
                        enum: [HeadOfOrganizer, EventTreasurer, OrganizerMember]
                        example: HeadOfOrganizer
      responses:
        '200':
          description: Chỉ định nhân sự thành công

  /events/{eventId}/notifications:
    get:
      summary: Xem lịch sử thông báo đã phát của sự kiện (US-22)
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách thông báo sự kiện

  /events/{eventId}/registrations:
    post:
      summary: Đăng ký tham gia sự kiện (US-06)
      description: |
        Thành viên / Người đại diện hộ gia đình đăng ký số lượng người tham dự, khẩu phần ăn (chay/mặn) và phương tiện di chuyển khi sự kiện đang mở tiếp nhận đăng ký (RegistrationOpen).
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT_2026_01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAttendeesRequest'
      responses:
        '201':
          description: Đăng ký tham gia sự kiện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'
        '400':
          description: Dữ liệu không hợp lệ hoặc sự kiện không mở đăng ký
        '409':
          description: Hộ gia đình đã có lượt đăng ký đang hoạt động
    get:
      summary: Danh sách hộ gia đình đăng ký tham gia sự kiện (US-06)
      description: |
        Ban tổ chức, Trưởng tộc hoặc Admin xem danh sách tất cả các hộ gia đình đã đăng ký (hỗ trợ phân trang).
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: "registrationDate,desc"
      responses:
        '200':
          description: Danh sách lượt đăng ký phân trang

  /events/{eventId}/registrations/summary:
    get:
      summary: Tổng hợp số liệu cộng dồn cỗ bàn và người tham dự (US-06)
      description: |
        Cung cấp số liệu thống kê tổng hợp cộng dồn thời gian thực cho Ban tổ chức nắm bắt chính xác số lượng cỗ bàn, người tham dự để chuẩn bị khánh tiết chu đáo.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thống kê số lượng đăng ký, người tham dự và cỗ bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistrationSummary'

  /events/{eventId}/registrations/me:
    get:
      summary: Xem thông tin đăng ký của chính hộ gia đình (US-06)
      description: |
        Thành viên tra cứu thông tin đăng ký hiện tại của hộ gia đình mình cho sự kiện.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thông tin đăng ký của hộ gia đình
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'
        '404':
          description: Hộ gia đình chưa đăng ký sự kiện này

  /events/{eventId}/registrations/{registrationId}:
    get:
      summary: Xem chi tiết một lượt đăng ký tham gia sự kiện (US-06)
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết lượt đăng ký
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'

  /events/{eventId}/registrations/{registrationId}/request-modification:
    post:
      summary: Gửi yêu cầu thay đổi số lượng người / khẩu phần / phương tiện (US-06)
      description: |
        Người đại diện hộ gia đình gửi yêu cầu chỉnh sửa thông tin đăng ký kèm lý do. Lượt đăng ký chuyển sang trạng thái PendingModification chờ Ban tổ chức phê duyệt.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestModifyRegistrationRequest'
      responses:
        '200':
          description: Yêu cầu thay đổi thông tin đã được ghi nhận chờ duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'

  /events/{eventId}/registrations/{registrationId}/request-cancellation:
    post:
      summary: Gửi yêu cầu hủy đăng ký tham gia sự kiện (US-06)
      description: |
        Người đại diện hộ gia đình gửi yêu cầu hủy đăng ký kèm lý do. Lượt đăng ký chuyển sang trạng thái PendingCancellation chờ Ban tổ chức phê duyệt.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCancelRegistrationRequest'
      responses:
        '200':
          description: Yêu cầu hủy đăng ký đã được ghi nhận chờ duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'

  /events/{eventId}/registrations/{registrationId}/review:
    post:
      summary: Ban tổ chức xét duyệt yêu cầu sửa đổi hoặc hủy đăng ký (US-06)
      description: |
        Trưởng ban tổ chức (HeadOfOrganizer), Trưởng tộc hoặc Admin phê duyệt (chấp thuận hoặc từ chối) yêu cầu thay đổi/hủy của hộ gia đình dựa trên tình hình chuẩn bị cỗ bàn thực tế.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRegistrationRequest'
      responses:
        '200':
          description: Xét duyệt yêu cầu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'

  /events/{eventId}/advance-vouchers:
    post:
      summary: Lập phiếu cấp phát kinh phí tạm ứng (Phân hệ 3)
      tags:
        - Finance & Vouchers
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - taskId
                - recipientMemberId
                - advanceAmount
                - receivedDate
                - settlementDeadline
              properties:
                taskId:
                  type: string
                  example: TASK_001
                recipientMemberId:
                  type: string
                  example: MEM_001
                advanceAmount:
                  type: number
                  example: 5000000.00
                receivedDate:
                  type: string
                  format: date-time
                settlementDeadline:
                  type: string
                  format: date-time
                commitmentNotes:
                  type: string
                  example: Chi phí mua hoa quả, bánh kẹo
      responses:
        '201':
          description: Lập phiếu tạm ứng thành công

  /events/{eventId}/contributions:
    post:
      summary: Tiếp nhận đóng góp / cúng tiến (Tiền mặt hoặc Hiện vật)
      tags:
        - Contributions & Assets
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payerMemberId
                - contributionType
                - memberAllocations
              properties:
                payerMemberId:
                  type: string
                  example: MEM_001
                contributionType:
                  type: string
                  enum: [Cash, InKind]
                  example: Cash
                cashDetail:
                  type: object
                  properties:
                    amount:
                      type: number
                      example: 2000000.00
                    paymentMethod:
                      type: string
                      enum: [Cash, BankTransfer]
                      example: BankTransfer
                    receiptNumber:
                      type: string
                      example: REC-2026-0001
                memberAllocations:
                  type: array
                  items:
                    type: object
                    required:
                      - memberId
                      - recordedAmount
                    properties:
                      memberId:
                        type: string
                        example: MEM_001
                      recordedAmount:
                        type: number
                        example: 2000000.00
      responses:
        '201':
          description: Ghi nhận đóng góp thành công

  /ledger/immutable:
    get:
      summary: Tra cứu Sổ cái Quỹ chung bất biến (Audit Trail NFR-01)
      tags:
        - Finance & Vouchers
      parameters:
        - name: eventId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Danh sách các bút toán sổ cái bất biến

  /invitations/general:
    post:
      summary: Tạo mã mời chung gia phả (US-16)
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetBranchId:
                  type: string
                  example: BRANCH_ROOT
                maxUses:
                  type: integer
                  example: 100
                validityDays:
                  type: integer
                  example: 30
      responses:
        '201':
          description: Tạo mã mời thành công
        '400':
          description: Tham số không hợp lệ
        '403':
          description: Không có quyền (chỉ dành cho ROLE_CLAN_HEAD hoặc ROLE_ADMIN)
    get:
      summary: Lấy danh sách các mã mời chung đang hoạt động
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách mã mời chung

  /invitations/{inviteCode}:
    get:
      summary: Xem chi tiết thông tin mã mời (Public cho trang đón tiếp US-17)
      tags:
        - Invitations & Onboarding
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
            example: 8K9P2X7N
      responses:
        '200':
          description: Thông tin mã mời
        '404':
          description: Mã mời không tồn tại hoặc đã bị vô hiệu hóa

  /invitations/{inviteCode}/deactivate:
    patch:
      summary: Vô hiệu hóa mã mời sớm
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vô hiệu hóa thành công
        '403':
          description: Không có quyền thực hiện

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Nhập JWT Access Token nhận được từ API /auth/login.
        Token tự động đính kèm quyền hạn ROLE_CLAN_HEAD và clanId cho người tạo cây.

  schemas:
    CreateMemberRequest:
      type: object
      description: |
        Payload tạo thành viên. `branchId` KHÔNG nằm trong body (lấy từ path variable).
        `memberId`, `isPlaceholder`, `createdAt` do server sinh và bị bỏ qua nếu client gửi lên.
      required:
        - fullName
        - gender
        - generation
      properties:
        fullName:
          type: string
          maxLength: 100
          description: "`members.full_name` VARCHAR(100) NOT NULL"
          example: Nguyễn Văn An
        dateOfBirth:
          type: string
          format: date
          description: "`members.date_of_birth` DATE, không được ở tương lai"
          example: "1990-05-20"
        gender:
          type: string
          enum: [Male, Female, Other]
          description: "`members.gender` CHECK (Male|Female|Other)"
          example: Male
        generation:
          type: integer
          minimum: 1
          description: "`members.generation` INT NOT NULL CHECK >= 1; không nhỏ hơn `generation_level` của chi/nhánh"
          example: 3
        status:
          type: string
          enum: [Living, Deceased]
          default: Living
          description: "`members.status` VARCHAR(20) NOT NULL DEFAULT 'Living'; bỏ trống thì mặc định Living"
          example: Living
        deathDateLunar:
          type: string
          maxLength: 50
          description: "`members.death_date_lunar` VARCHAR(50)"
          example: "15/08 Âm lịch"

    MemberResponse:
      type: object
      description: Read model của bảng `members`; `branchName` và `clanId` phân giải qua `family_branches`.
      properties:
        memberId:
          type: string
          maxLength: 20
          example: MEMK4F8ZQ1M7XB3QP
        fullName:
          type: string
          example: Nguyễn Văn An
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: "1990-05-20"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: Male
        generation:
          type: integer
          example: 3
        status:
          type: string
          enum: [Living, Deceased]
          example: Living
        deathDateLunar:
          type: string
          nullable: true
          example: "15/08 Âm lịch"
        branchId:
          type: string
          example: BR_CHILD_1
        branchName:
          type: string
          example: Chi Hai
        clanId:
          type: string
          example: CLAN_DEFAULT
        isPlaceholder:
          type: boolean
          description: Luôn `true` với hồ sơ do quản lý tạo (chờ nhận liên kết ở US-18).
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-10-23T15:00:00Z"

    ApiResponseMember:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Member created successfully
        data:
          $ref: '#/components/schemas/MemberResponse'
        timestamp:
          type: string
          format: date-time

    ApiResponseError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Branch not found with ID: BR_CHILD_1 in clan: CLAN_DEFAULT"
        errors:
          type: object
          description: "Chỉ xuất hiện khi `400` do Bean Validation; map `tên trường -> thông điệp`."
          additionalProperties:
            type: string
          example:
            fullName: Full name must not be blank
        timestamp:
          type: string
          format: date-time




    RegisterAttendeesRequest:
      type: object
      required:
        - totalAttendees
      properties:
        representativeMemberId:
          type: string
          description: Mã thành viên đại diện (tùy chọn, mặc định lấy thành viên gắn với tài khoản đang đăng nhập; Ban tổ chức có thể chỉ định khi đăng ký hộ).
          example: MEM_001
        totalAttendees:
          type: integer
          minimum: 1
          description: Tổng số người tham dự của hộ gia đình
          example: 4
        vegetarianMeals:
          type: integer
          minimum: 0
          description: Số suất ăn chay
          example: 1
        savoryMeals:
          type: integer
          minimum: 0
          description: Số suất ăn mặn
          example: 3
        dietaryRequirements:
          type: string
          description: Ghi chú ăn uống đặc biệt (dị ứng, ăn kiêng)
          example: "1 người ăn chay thanh tịnh, không hành tỏi"
        transportationNotes:
          type: string
          description: Ghi chú phương tiện di chuyển
          example: "Gia đình tự túc 1 xe ô tô 4 chỗ"
        attendingMemberIds:
          type: array
          items:
            type: string
          description: Danh sách mã thành viên trong gia đình đi cùng (nếu có trong gia phả)
          example: ["MEM_002", "MEM_003"]

    RequestModifyRegistrationRequest:
      type: object
      required:
        - proposedTotalAttendees
        - modificationReason
      properties:
        proposedTotalAttendees:
          type: integer
          minimum: 1
          example: 3
        proposedVegetarianMeals:
          type: integer
          minimum: 0
          example: 0
        proposedSavoryMeals:
          type: integer
          minimum: 0
          example: 3
        proposedDietaryRequirements:
          type: string
          example: "Đổi sang toàn bộ cỗ mặn"
        proposedTransportationNotes:
          type: string
          example: "Đi xe máy riêng"
        modificationReason:
          type: string
          example: "Hai cháu bận thi học kỳ đột xuất không tham gia được"

    RequestCancelRegistrationRequest:
      type: object
      required:
        - cancellationReason
      properties:
        cancellationReason:
          type: string
          example: "Gia đình phải đi công tác xa đột xuất"

    ReviewRegistrationRequest:
      type: object
      required:
        - approved
      properties:
        approved:
          type: boolean
          description: true nếu chấp thuận thay đổi/hủy; false nếu từ chối
          example: true
        rejectionReason:
          type: string
          description: Lý do từ chối (bắt buộc khi approved = false)
          example: "Ban tổ chức đã chốt đặt cọc và mua nguyên liệu cho 5 suất ăn"

    RegistrationMemberDetailResponse:
      type: object
      properties:
        memberId:
          type: string
          example: MEM_002
        fullName:
          type: string
          example: Nguyễn Văn Con Cả
        isCheckedIn:
          type: boolean
          example: false

    RegistrationResponse:
      type: object
      properties:
        registrationId:
          type: string
          example: REG_20261101_ABC123
        eventId:
          type: string
          example: EVT_2026_01
        representativeMemberId:
          type: string
          example: MEM_001
        representativeMemberName:
          type: string
          example: Nguyễn Văn Đại Diện
        totalAttendees:
          type: integer
          example: 4
        vegetarianMeals:
          type: integer
          example: 1
        savoryMeals:
          type: integer
          example: 3
        dietaryRequirements:
          type: string
          example: "1 người ăn chay"
        transportationNotes:
          type: string
          example: "Đi ô tô riêng"
        registrationDate:
          type: string
          format: date-time
          example: "2026-11-01T08:00:00Z"
        status:
          type: string
          enum: [Confirmed, PendingModification, PendingCancellation, Cancelled]
          example: Confirmed
        proposedTotalAttendees:
          type: integer
          nullable: true
          example: 3
        proposedVegetarianMeals:
          type: integer
          nullable: true
          example: 0
        proposedSavoryMeals:
          type: integer
          nullable: true
          example: 3
        proposedDietaryRequirements:
          type: string
          nullable: true
        proposedTransportationNotes:
          type: string
          nullable: true
        modificationReason:
          type: string
          nullable: true
        reviewedByAccountId:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        attendingMembers:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationMemberDetailResponse'

    RegistrationSummaryResponse:
      type: object
      properties:
        eventId:
          type: string
          example: EVT_2026_01
        totalRegistrations:
          type: integer
          example: 15
        totalAttendees:
          type: integer
          example: 52
        totalVegetarianMeals:
          type: integer
          example: 6
        totalSavoryMeals:
          type: integer
          example: 46

    ApiResponseRegistration:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Đăng ký tham gia sự kiện thành công
        data:
          $ref: '#/components/schemas/RegistrationResponse'
        timestamp:
          type: string
          format: date-time

    ApiResponseRegistrationSummary:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/RegistrationSummaryResponse'
        timestamp:
          type: string
          format: date-time
