openapi: 3.0.3
info:
  title: Family Management Fund API (familyfund-api)
  version: 1.0.0
  description: |
    Core RESTful API documentation for Family Management Backend system.
    Supports Family Tree Management, Event Planning & Registration, Advance/Settlement Vouchers,
    Immutable Ledgers (Audit Trail), and Multi-channel Contributions.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Spring Boot Backend Server
paths:
  /auth/register-creator:
    post:
      summary: Đăng ký tài khoản người khởi tạo & tạo dòng họ mới (US-01)
      description: |
        Khởi tạo tài khoản người dùng, tạo một dòng họ mới (Multi-tenant), dựng nhánh gốc (Root Branch)
        của cây phả hệ, tạo hồ sơ Thủy tổ (nếu có) và hồ sơ thành viên người khởi tạo với vai trò ROLE_CLAN_HEAD.
      tags:
        - Authentication
        - Clan & Family Tree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clanName
                - fullName
                - phoneNumber
                - password
                - gender
              properties:
                clanName:
                  type: string
                  example: Dòng họ Nguyễn Văn
                ancestorName:
                  type: string
                  example: Cụ Tổ Nguyễn Văn Khởi
                originLocation:
                  type: string
                  example: Hà Nam, Việt Nam
                establishedYear:
                  type: integer
                  example: 1820
                description:
                  type: string
                  example: Chi họ khởi tổ tại Hà Nam
                fullName:
                  type: string
                  example: Nguyễn Văn An
                phoneNumber:
                  type: string
                  example: "0987654321"
                password:
                  type: string
                  format: password
                  example: SecurePassword123
                gender:
                  type: string
                  enum: [Male, Female, Other]
                  example: Male
                email:
                  type: string
                  format: email
                  example: nguyenvanan@example.com
                dateOfBirth:
                  type: string
                  format: date
                  example: 1985-05-15
                generation:
                  type: integer
                  example: 6
      responses:
        '201':
          description: Đăng ký và khởi tạo dòng họ thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đăng ký người khởi tạo và tạo dòng họ mới thành công
                  data:
                    type: object
                    properties:
                      account:
                        type: object
                        properties:
                          accountId:
                            type: string
                            example: ACC_9A8B7C6D
                          phoneNumber:
                            type: string
                            example: "0987654321"
                          email:
                            type: string
                            example: nguyenvanan@example.com
                          accountStatus:
                            type: string
                            example: Active
                          roles:
                            type: array
                            items:
                              type: string
                            example: [ROLE_CLAN_HEAD]
                          createdAt:
                            type: string
                            format: date-time
                      clan:
                        type: object
                        properties:
                          clanId:
                            type: string
                            example: CLAN_F1E2D3C4
                          clanName:
                            type: string
                            example: Dòng họ Nguyễn Văn
                          ancestorName:
                            type: string
                            example: Cụ Tổ Nguyễn Văn Khởi
                          originLocation:
                            type: string
                            example: Hà Nam, Việt Nam
                          establishedYear:
                            type: integer
                            example: 1820
                          description:
                            type: string
                            example: Chi họ khởi tổ tại Hà Nam
                      member:
                        type: object
                        properties:
                          memberId:
                            type: string
                            example: MEM_4B3A2C1D
                          fullName:
                            type: string
                            example: Nguyễn Văn An
                          gender:
                            type: string
                            example: Male
                          generation:
                            type: integer
                            example: 6
                          dateOfBirth:
                            type: string
                            format: date
                            example: 1985-05-15
                          branchId:
                            type: string
                            example: BR_1234ABCD
        '400':
          description: Dữ liệu không hợp lệ hoặc số điện thoại / email đã tồn tại
  /auth/login:
    post:
      summary: Đăng nhập hệ thống
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginIdentifier
                - password
              properties:
                loginIdentifier:
                  type: string
                  example: admin_hoang
                password:
                  type: string
                  format: password
                  example: Admin@123
      responses:
        '200':
          description: Đăng nhập thành công, trả về JWT Token và thông tin tài khoản
        '401':
          description: Sai thông tin đăng nhập

  /clans:
    get:
      summary: Lấy danh sách dòng họ (Multi-tenant)
      tags:
        - Clan & Family Tree
      responses:
        '200':
          description: Danh sách dòng họ
    post:
      summary: Khởi tạo dòng họ mới
      tags:
        - Clan & Family Tree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clanName
              properties:
                clanName:
                  type: string
                  example: Dòng họ Nguyễn Trọng
                establishedDate:
                  type: string
                  format: date
                  example: 1850-01-01
                inviteCode:
                  type: string
                  example: CLAN-NGUYEN-1850
      responses:
        '201':
          description: Tạo thành công

  /clans/{clanId}/members:
    get:
      summary: Lấy danh sách thành viên trong dòng họ
      tags:
        - Clan & Family Tree
      parameters:
        - name: clanId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách thành viên

  /members/{memberId}/life-status:
    put:
      summary: Cập nhật tình trạng sống / đã mất, ngày mất và tính ngày giỗ âm lịch (US-27)
      description: |
        Cho phép Trưởng tộc / Trưởng chi cập nhật tình trạng thành viên (sống hoặc đã mất).
        Khi cập nhật `Deceased` (Đã mất):
        - Bắt buộc nhập `deathDate` (Dương lịch).
        - Hệ thống tự động chuyển đổi sang ngày âm lịch tương ứng và lưu vào `death_date_lunar`.
        - Tự động phát Domain Event khóa tài khoản đăng nhập (nếu có).
        - Giữ nguyên 100% vị trí nút trên cây phả hệ và toàn bộ lịch sử đóng góp tài chính.
      tags:
        - Clan & Family Tree
      security:
        - BearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          description: Mã thành viên cần cập nhật
          schema:
            type: string
            example: MEM_001
        - name: X-Clan-Id
          in: header
          required: false
          description: Mã dòng họ hiện hành (multi-tenant)
          schema:
            type: string
            example: CLAN_DEFAULT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLifeStatusRequest'
      responses:
        '200':
          description: Cập nhật tình trạng thành viên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMember'
        '400':
          description: Ngày mất không hợp lệ (nằm trong tương lai hoặc trước ngày sinh)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '403':
          description: Không có quyền (chỉ Trưởng tộc hoặc Trưởng chi quản lý chi của thành viên)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Không tìm thấy thành viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /branches/{branchId}/members:
    post:
      summary: Tạo hồ sơ thành viên mới trong một chi/nhánh (US-03)
      description: |
        Tạo hồ sơ thành viên (`members`) gắn với chi/nhánh nêu trong đường dẫn, thuộc dòng họ hiện hành
        (multi-tenant: header `X-Clan-Id` hoặc query param `clanId`, mặc định `CLAN_DEFAULT`).

        Quy tắc nghiệp vụ:
        - `branchId` **chỉ** lấy từ đường dẫn, không truyền lại trong body.
        - `memberId` do server sinh (`MEM` + timestamp Base36 + hậu tố CSPRNG, tối đa 20 ký tự).
        - `isPlaceholder` luôn được server đặt `true` (hồ sơ chờ tài khoản người dùng nhận liên kết - US-18).
        - Chống trùng hồ sơ trong cùng dòng họ theo bộ (`fullName` không phân biệt hoa thường, `gender`, `generation`, `dateOfBirth`).
        - `generation` không được nhỏ hơn `generation_level` của chi/nhánh.
      tags:
        - Clan & Family Tree
      security:
        - BearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          description: Mã chi/nhánh thuộc dòng họ hiện hành (`family_branches.branch_id`, VARCHAR(20))
          schema:
            type: string
            maxLength: 20
            example: BR_CHILD_1
        - name: X-Clan-Id
          in: header
          required: false
          description: Mã dòng họ hiện hành (multi-tenant). Bỏ trống sẽ dùng `CLAN_DEFAULT`.
          schema:
            type: string
            example: CLAN_DEFAULT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: Tạo thành viên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMember'
        '400':
          description: Payload sai ràng buộc schema, `branchId` sai định dạng, hoặc thế hệ thấp hơn cấp của chi/nhánh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '403':
          description: Không có quyền (chỉ `ROLE_CLAN_HEAD`, `ROLE_BRANCH_HEAD`, `ROLE_ADMIN`; Trưởng chi chỉ được thêm vào chi mình quản lý)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Dòng họ hoặc chi/nhánh không tồn tại trong dòng họ hiện hành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '409':
          description: Hồ sơ trùng với thành viên đã có trong dòng họ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /branches/{branchId}/virtual-members:
    post:
      summary: Tạo hồ sơ ảo (vị trí lá) và mã liên kết vị trí dùng một lần (US-18)
      description: |
        Trưởng tộc / Trưởng chi tạo một **hồ sơ ảo** (`members.is_placeholder = true`) cho vị trí lá trên cây
        phả hệ **chưa có tài khoản** (`user_accounts.member_id` để trống), đồng thời phát hành một
        **PositionLinkCode dùng một lần** (`invitation_codes.invite_type = 'PositionLinkCode'`,
        `max_uses = 1`, `target_member_id` = hồ sơ vừa tạo) để người nhận vị trí tự liên kết tài khoản sau này.

        Quy tắc nghiệp vụ:
        - `branchId` **chỉ** lấy từ đường dẫn, không truyền lại trong body.
        - `memberId`, `isPlaceholder`, `inviteCode`, `maxUses`, `usedCount` do server quyết định, không nhận từ client.
        - Hồ sơ ảo dùng chung mọi bất biến của US-03: chi/nhánh phải thuộc dòng họ hiện hành, `generation`
          không nhỏ hơn `generation_level` của chi/nhánh, chống trùng hồ sơ trong toàn dòng họ.
        - Mã liên kết hết hạn sau `validityDays` ngày (mặc định 7) hoặc đúng `expiresAt` nếu client truyền vào.
        - `invitation_codes.target_member_id` là `UNIQUE`: mỗi vị trí chỉ có tối đa một mã liên kết.
        - Hồ sơ ảo và mã liên kết được ghi trong **một transaction**: lỗi ở bất kỳ bước nào cũng không để lại dữ liệu.
      tags:
        - Clan & Family Tree
        - Invitations
      security:
        - BearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          description: Mã chi/nhánh nhận hồ sơ ảo (`family_branches.branch_id`, VARCHAR(20))
          schema:
            type: string
            maxLength: 20
            example: BR_CHI_2
        - name: X-Clan-Id
          in: header
          required: false
          description: Mã dòng họ hiện hành (multi-tenant). Bỏ trống sẽ dùng `CLAN_DEFAULT`.
          schema:
            type: string
            example: CLAN_DEFAULT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualMemberRequest'
      responses:
        '201':
          description: Tạo hồ sơ ảo và mã liên kết vị trí thành công (`Location` trỏ tới `/api/v1/invitations/{inviteCode}`)
          headers:
            Location:
              description: Đường dẫn tài nguyên của mã liên kết vị trí vừa tạo.
              schema:
                type: string
                example: /api/v1/invitations/8K9P2X7N
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVirtualMember'
        '400':
          description: Payload sai ràng buộc schema, `branchId` sai định dạng, thế hệ thấp hơn cấp của chi/nhánh, hoặc `expiresAt` không ở tương lai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '401':
          description: Chưa xác thực (không có hoặc token không hợp lệ)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '403':
          description: Không có quyền (chỉ `ROLE_CLAN_HEAD`, `ROLE_BRANCH_HEAD`, `ROLE_ADMIN`; Trưởng chi chỉ được tạo trong chi mình quản lý)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Dòng họ hoặc chi/nhánh không tồn tại trong dòng họ hiện hành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '409':
          description: Hồ sơ trùng với thành viên đã có trong dòng họ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /position-links/{inviteCode}:
    get:
      summary: Xem trước vị trí phả hệ của mã liên kết vị trí (US-19)
      description: |-
        Endpoint **công khai** dùng cho trang đích mà người nhận mở từ link chia sẻ
        (`app.invitation.position-link-base-url?code=...`). Trả về dòng họ, chi/nhánh và hồ sơ mà mã đang trỏ tới
        để người nhận xác nhận đúng vị trí của mình trước khi đăng ký.

        Chỉ những mã còn dùng được mới xem trước được: mã không tồn tại hoặc không phải `PositionLinkCode` ⇒ `404`;
        mã đã dùng, đã bị vô hiệu hoá hoặc hết hạn ⇒ `400`.
      tags:
        - Invitations
        - Clan & Family Tree
      parameters:
        - name: inviteCode
          in: path
          required: true
          description: Mã liên kết vị trí (8 ký tự Base32 CSPRNG)
          schema:
            type: string
            maxLength: 30
            example: 8K9P2X7N
      responses:
        '200':
          description: Thông tin vị trí mà mã liên kết đang trỏ tới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePositionLinkPreview'
        '400':
          description: Mã rỗng/quá dài, đã dùng, đã bị vô hiệu hoá hoặc đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Mã không tồn tại hoặc không phải là `PositionLinkCode`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /position-links/{inviteCode}/claim:
    post:
      summary: Nhập PositionLinkCode khi đăng ký để tự động gia nhập đúng chi/nhánh (US-19)
      description: |-
        Người nhận vị trí **đăng ký tài khoản ngay tại trang của mã liên kết**: gửi số điện thoại + mật khẩu kèm mã,
        hệ thống liên kết tài khoản với hồ sơ ảo mà mã trỏ tới và **kích hoạt tài khoản ngay**, không cần
        bất kỳ bước xác minh/phê duyệt nào (khác với luồng đơn gia nhập US-17).

        Quy tắc nghiệp vụ:
        - Mã đúng chính là bằng chứng sở hữu vị trí: `members.is_placeholder` chuyển `true` sang `false`, mọi thuộc
          tính khác của hồ sơ (họ tên, đời, chi/nhánh, sự kiện/đóng góp đã ghi trên `member_id`) được giữ nguyên.
        - Số điện thoại **chưa tồn tại** thì tạo `user_accounts` mới với `account_status = 'Active'` và gán `ROLE_MEMBER`.
        - Số điện thoại **đã có** (ví dụ tài khoản `PendingApproval` từ US-17) thì mật khẩu phải khớp, tài khoản được
          kích hoạt (`PendingApproval` sang `Active`) và liên kết với vị trí; không tạo thêm tài khoản.
        - Mã dùng một lần: sau khi thành công `used_count = 1` và `is_active = false`.
        - Hồ sơ ảo chưa từng có bảng ghi `user_accounts` nên mỗi vị trí chỉ thuộc về đúng một tài khoản.
        - Toàn bộ trao đổi nằm trong **một transaction**: lỗi ở bất kỳ bước nào cũng không tiêu mã, không tạo tài khoản.
      tags:
        - Invitations
        - Authentication
      parameters:
        - name: inviteCode
          in: path
          required: true
          description: Mã liên kết vị trí nhận được từ trưởng tộc / trưởng chi
          schema:
            type: string
            maxLength: 30
            example: 8K9P2X7N
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimPositionRequest'
      responses:
        '200':
          description: Tài khoản đã được liên kết với vị trí và kích hoạt (`Active`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClaimPosition'
        '400':
          description: Payload sai ràng buộc, mã đã dùng/hết hạn/vô hiệu hoá, hoặc sai mật khẩu của số điện thoại đã đăng ký
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '403':
          description: Tài khoản đang ở trạng thái `Suspended` hoặc `Deactivated`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Mã không tồn tại hoặc không phải là `PositionLinkCode`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '409':
          description: Vị trí đã được nhận, số điện thoại đã liên kết hồ sơ khác, hoặc email đã được đăng ký
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /events:
    get:
      summary: Danh sách sự kiện của dòng họ
      tags:
        - Events & Registration
      responses:
        '200':
          description: Danh sách sự kiện
    post:
      summary: Khởi tạo kế hoạch sự kiện mới (US-21)
      tags:
        - Events & Registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventName
                - eventDatetime
                - location
              properties:
                eventName:
                  type: string
                  example: Giỗ Tổ 2026
                eventDatetime:
                  type: string
                  format: date-time
                  example: "2026-04-26T08:00:00Z"
                eventDateLunar:
                  type: string
                  example: "10/03 Bính Ngọ"
                location:
                  type: string
                  example: Nhà thờ tổ Chi 1
                estimatedBudget:
                  type: number
                  example: 50000000.00
                description:
                  type: string
                  example: Lễ giỗ tổ truyền thống dòng họ
      responses:
        '201':
          description: Tạo sự kiện thành công

  /events/{eventId}:
    get:
      summary: Xem chi tiết sự kiện và ban tổ chức (US-21)
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT_20260426
      responses:
        '200':
          description: Chi tiết sự kiện
    put:
      summary: Cập nhật thông tin và lịch trình sự kiện (US-22)
      description: |
        Cập nhật thông tin sự kiện. Tự động so sánh lịch trình cũ và mới (ngày giờ, địa điểm) để phát thông báo biến động tới con cháu.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventName
                - eventDatetime
                - location
              properties:
                eventName:
                  type: string
                  example: Giỗ Tổ 2026 (Điều chỉnh)
                eventDatetime:
                  type: string
                  format: date-time
                  example: "2026-04-27T08:00:00Z"
                eventDateLunar:
                  type: string
                  example: "11/03 Bính Ngọ"
                location:
                  type: string
                  example: Từ đường Đại Tộc
                estimatedBudget:
                  type: number
                  example: 55000000.00
                description:
                  type: string
                  example: Cập nhật địa điểm sang từ đường lớn
      responses:
        '200':
          description: Cập nhật thông tin sự kiện thành công

  /events/{eventId}/status:
    patch:
      summary: Chuyển đổi trạng thái vòng đời sự kiện (US-21)
      description: |
        Quản lý chuyển đổi trạng thái vòng đời: Draft -> RegistrationOpen -> RegistrationClosed -> Ongoing -> Ended -> Closed.
        Được bảo vệ bởi @PreAuthorize("hasAnyRole('CLAN_HEAD', 'ADMIN') or @nhanSuSuKien.xacThucQuyenTheoNguCanh(#eventId, 'HeadOfOrganizer')").
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Draft, RegistrationOpen, RegistrationClosed, Ongoing, Ended, Closed]
                  example: RegistrationOpen
      responses:
        '200':
          description: Cập nhật trạng thái sự kiện thành công

  /events/{eventId}/personnel:
    post:
      summary: Chỉ định Ban tổ chức và Thủ quỹ sự kiện (US-21)
      description: |
        Trưởng tộc chỉ định nhân sự gắn riêng với sự kiện. Ràng buộc: tối đa 1 HeadOfOrganizer, 1 EventTreasurer, không giới hạn OrganizerMember.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - personnel
              properties:
                personnel:
                  type: array
                  items:
                    type: object
                    required:
                      - memberId
                      - role
                    properties:
                      memberId:
                        type: string
                        example: MEM_001
                      role:
                        type: string
                        enum: [HeadOfOrganizer, EventTreasurer, OrganizerMember]
                        example: HeadOfOrganizer
      responses:
        '200':
          description: Chỉ định nhân sự thành công

  /events/{eventId}/notifications:
    get:
      summary: Xem lịch sử thông báo đã phát của sự kiện (US-22)
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách thông báo sự kiện

  /events/{eventId}/registrations:
    post:
      summary: Đăng ký tham gia sự kiện (US-06)
      description: |
        Thành viên / Người đại diện hộ gia đình đăng ký số lượng người tham dự, khẩu phần ăn (chay/mặn) và phương tiện di chuyển khi sự kiện đang mở tiếp nhận đăng ký (RegistrationOpen).
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT_2026_01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAttendeesRequest'
      responses:
        '201':
          description: Đăng ký tham gia sự kiện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'
        '400':
          description: Dữ liệu không hợp lệ hoặc sự kiện không mở đăng ký
        '409':
          description: Hộ gia đình đã có lượt đăng ký đang hoạt động
    get:
      summary: Danh sách hộ gia đình đăng ký tham gia sự kiện (US-06)
      description: |
        Ban tổ chức, Trưởng tộc hoặc Admin xem danh sách tất cả các hộ gia đình đã đăng ký (hỗ trợ phân trang).
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: "registrationDate,desc"
      responses:
        '200':
          description: Danh sách lượt đăng ký phân trang

  /events/{eventId}/registrations/summary:
    get:
      summary: Tổng hợp số liệu cộng dồn cỗ bàn và người tham dự (US-06)
      description: |
        Cung cấp số liệu thống kê tổng hợp cộng dồn thời gian thực cho Ban tổ chức nắm bắt chính xác số lượng cỗ bàn, người tham dự để chuẩn bị khánh tiết chu đáo.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thống kê số lượng đăng ký, người tham dự và cỗ bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistrationSummary'

  /events/{eventId}/registrations/me:
    get:
      summary: Xem thông tin đăng ký của chính hộ gia đình (US-06)
      description: |
        Thành viên tra cứu thông tin đăng ký hiện tại của hộ gia đình mình cho sự kiện.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thông tin đăng ký của hộ gia đình
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'
        '404':
          description: Hộ gia đình chưa đăng ký sự kiện này

  /events/{eventId}/registrations/{registrationId}:
    get:
      summary: Xem chi tiết một lượt đăng ký tham gia sự kiện (US-06)
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết lượt đăng ký
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'

  /events/{eventId}/registrations/{registrationId}/request-modification:
    post:
      summary: Gửi yêu cầu thay đổi số lượng người / khẩu phần / phương tiện (US-06)
      description: |
        Người đại diện hộ gia đình gửi yêu cầu chỉnh sửa thông tin đăng ký kèm lý do. Lượt đăng ký chuyển sang trạng thái PendingModification chờ Ban tổ chức phê duyệt.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestModifyRegistrationRequest'
      responses:
        '200':
          description: Yêu cầu thay đổi thông tin đã được ghi nhận chờ duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'

  /events/{eventId}/registrations/{registrationId}/request-cancellation:
    post:
      summary: Gửi yêu cầu hủy đăng ký tham gia sự kiện (US-06)
      description: |
        Người đại diện hộ gia đình gửi yêu cầu hủy đăng ký kèm lý do. Lượt đăng ký chuyển sang trạng thái PendingCancellation chờ Ban tổ chức phê duyệt.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCancelRegistrationRequest'
      responses:
        '200':
          description: Yêu cầu hủy đăng ký đã được ghi nhận chờ duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'

  /events/{eventId}/registrations/{registrationId}/review:
    post:
      summary: Ban tổ chức xét duyệt yêu cầu sửa đổi hoặc hủy đăng ký (US-06)
      description: |
        Trưởng ban tổ chức (HeadOfOrganizer), Trưởng tộc hoặc Admin phê duyệt (chấp thuận hoặc từ chối) yêu cầu thay đổi/hủy của hộ gia đình dựa trên tình hình chuẩn bị cỗ bàn thực tế.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRegistrationRequest'
      responses:
        '200':
          description: Xét duyệt yêu cầu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistration'

  /events/{eventId}/advance-vouchers:
    post:
      summary: Lập phiếu cấp phát kinh phí tạm ứng (Phân hệ 3)
      tags:
        - Finance & Vouchers
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - taskId
                - recipientMemberId
                - advanceAmount
                - receivedDate
                - settlementDeadline
              properties:
                taskId:
                  type: string
                  example: TASK_001
                recipientMemberId:
                  type: string
                  example: MEM_001
                advanceAmount:
                  type: number
                  example: 5000000.00
                receivedDate:
                  type: string
                  format: date-time
                settlementDeadline:
                  type: string
                  format: date-time
                commitmentNotes:
                  type: string
                  example: Chi phí mua hoa quả, bánh kẹo
      responses:
        '201':
          description: Lập phiếu tạm ứng thành công

  /events/{eventId}/contributions:
    post:
      summary: Tiếp nhận đóng góp / cúng tiến (Tiền mặt hoặc Hiện vật)
      tags:
        - Contributions & Assets
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payerMemberId
                - contributionType
                - memberAllocations
              properties:
                payerMemberId:
                  type: string
                  example: MEM_001
                contributionType:
                  type: string
                  enum: [Cash, InKind]
                  example: Cash
                cashDetail:
                  type: object
                  properties:
                    amount:
                      type: number
                      example: 2000000.00
                    paymentMethod:
                      type: string
                      enum: [Cash, BankTransfer]
                      example: BankTransfer
                    receiptNumber:
                      type: string
                      example: REC-2026-0001
                memberAllocations:
                  type: array
                  items:
                    type: object
                    required:
                      - memberId
                      - recordedAmount
                    properties:
                      memberId:
                        type: string
                        example: MEM_001
                      recordedAmount:
                        type: number
                        example: 2000000.00
      responses:
        '201':
          description: Ghi nhận đóng góp thành công

  /ledger/immutable:
    get:
      summary: Tra cứu Sổ cái Quỹ chung bất biến (Audit Trail NFR-01)
      tags:
        - Finance & Vouchers
      parameters:
        - name: eventId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Danh sách các bút toán sổ cái bất biến

  /invitations/general:
    post:
      summary: Tạo mã mời chung gia phả (US-16)
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetBranchId:
                  type: string
                  example: BRANCH_ROOT
                maxUses:
                  type: integer
                  example: 100
                validityDays:
                  type: integer
                  example: 30
      responses:
        '201':
          description: Tạo mã mời thành công
        '400':
          description: Tham số không hợp lệ
        '403':
          description: Không có quyền (chỉ dành cho ROLE_CLAN_HEAD hoặc ROLE_ADMIN)
    get:
      summary: Lấy danh sách các mã mời chung đang hoạt động
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách mã mời chung

  /invitations/{inviteCode}:
    get:
      summary: Xem chi tiết thông tin mã mời (Public cho trang đón tiếp US-17)
      description: |
        Kiểm tra mã trước khi cho người dùng đi tiếp. Ba tình huống từ chối có `code` khác nhau để client
        hiển thị đúng thông báo: mã bị thu hồi (`INVITE_CODE_REVOKED`), mã hết hạn (`INVITE_CODE_EXPIRED`),
        mã hết lượt dùng (`INVITE_CODE_EXHAUSTED`). Mã không tồn tại trả `404` như trước.
      tags:
        - Invitations & Onboarding
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
            example: 8K9P2X7N
      responses:
        '200':
          description: Thông tin mã mời
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInviteCode'
        '400':
          description: |-
            Mã không còn dùng được. `code` cho biết lý do:
            - `INVITE_CODE_REVOKED`: mã đã bị thu hồi / vô hiệu hoá
            - `INVITE_CODE_EXPIRED`: mã đã hết hạn
            - `INVITE_CODE_EXHAUSTED`: mã đã hết lượt sử dụng
        '404':
          description: Mã mời không tồn tại
    patch:
      summary: Cập nhật hạn dùng / số lượt / trạng thái của mã mời (Trưởng tộc hoặc Admin)
      description: |
        Chỉ áp dụng các trường có trong payload. `maxUses` không được nhỏ hơn `usedCount` hiện tại.
        `isActive = true` dùng để kích hoạt lại một mã đã bị thu hồi; `validityDays` tính lại hạn từ thời điểm gọi
        khi không truyền `expiresAt`.
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
            example: 8K9P2X7N
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvitationRequest'
      responses:
        '200':
          description: Cập nhật thành công, trả về mã mời sau khi cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInviteCode'
        '400':
          description: Payload rỗng, `expiresAt` không ở tương lai, hoặc `maxUses` nhỏ hơn số lượt đã dùng
        '403':
          description: Không có quyền (chỉ ROLE_CLAN_HEAD hoặc ROLE_ADMIN)
        '404':
          description: Mã mời không tồn tại trong dòng họ hiện hành

  /invitations/{inviteCode}/deactivate:
    patch:
      summary: Vô hiệu hóa mã mời sớm
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vô hiệu hóa thành công
        '403':
          description: Không có quyền thực hiện

  /invitations/{inviteCode}/regenerate:
    post:
      summary: Tái tạo mã mời mới thay cho mã cũ (Trưởng tộc hoặc Admin)
      description: |
        Thu hồi mã cũ (`is_active = false`, bản ghi vẫn giữ để tra cứu) và phát hành mã mới kế thừa loại mã,
        nhánh mục tiêu, `maxUses` của mã cũ với `used_count` đặt lại bằng 0. Hạn dùng của mã mới: `expiresAt` >
        `validityDays` (nếu truyền) > phần hạn còn lại của mã cũ > 30 ngày mặc định.
        Mã liên kết vị trí (`PositionLinkCode`) không tái tạo được vì `target_member_id` là UNIQUE — hãy tạo
        hồ sơ ảo mới.
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
            example: 8K9P2X7N
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvitationRequest'
      responses:
        '201':
          description: Mã mới được tạo, header `Location` trỏ tới `/api/v1/invitations/{newCode}`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInviteCode'
        '400':
          description: Mã cũ là PositionLinkCode, hoặc `maxUses` nhỏ hơn số lượt đã dùng
        '403':
          description: Không có quyền (chỉ ROLE_CLAN_HEAD hoặc ROLE_ADMIN)
        '404':
          description: Mã mời không tồn tại trong dòng họ hiện hành

  /join-requests:
    get:
      summary: Danh sách yêu cầu gia nhập theo trạng thái & phạm vi nhánh (US-17)
      description: |
        `ROLE_CLAN_HEAD` và `ROLE_ADMIN` xem toàn dòng họ; `ROLE_BRANCH_HEAD` chỉ thấy yêu cầu thuộc các nhánh
        mình quản lý (nhánh mình đại diện + nhánh con cháu). Truyền `branchId` ngoài phạm vi quản lý ⇒ `400`.
        Mặc định `status = Pending`.
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Pending, Approved, Rejected]
            default: Pending
        - name: branchId
          in: query
          required: false
          schema:
            type: string
            example: BR_CHI_2
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách yêu cầu gia nhập phân trang
        '400':
          description: "`branchId` nằm ngoài phạm vi nhánh mà người duyệt quản lý"
        '403':
          description: Không có quyền duyệt yêu cầu

  /join-requests/{requestId}/approve:
    post:
      summary: Phê duyệt yêu cầu gia nhập, có thể chỉnh lại vị trí trước khi duyệt (US-17)
      description: |
        Trong một transaction: tạo `members` (và `family_branches` con nếu `proposalType = NewChildBranch`),
        gắn `user_accounts.member_id`, kích hoạt `account_status = Active`, cấp `ROLE_MEMBER`, tăng
        `invitation_codes.used_count`, cập nhật yêu cầu sang `Approved`, rồi phát domain event để thông báo
        kết quả cho người xin gia nhập.

        Body là tuỳ chọn: không gửi body thì dùng đúng vị trí ứng viên đề xuất. Nếu gửi `targetBranchId`, hệ thống
        kiểm tra nhánh tồn tại trong dòng họ (`404`) và người duyệt có quyền trên nhánh đó (`400`), sau đó lưu lại
        nhánh đã chỉnh vào yêu cầu. `proposedNewBranchName` chỉ dùng được với `NewChildBranch`.
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            example: REQ12345678901234
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveJoinRequest'
      responses:
        '200':
          description: Đã phê duyệt, trả về yêu cầu sau khi duyệt (kèm nhánh thực tế)
        '400':
          description: Yêu cầu đã được xử lý, người duyệt không có quyền trên nhánh, hoặc payload sai
        '404':
          description: Yêu cầu hoặc nhánh chỉnh lại không tồn tại trong dòng họ hiện hành

  /join-requests/{requestId}/reject:
    post:
      summary: Từ chối yêu cầu gia nhập kèm lý do (US-17)
      description: |
        Lưu `rejection_reason`, chuyển yêu cầu sang `Rejected`, vô hiệu hoá tài khoản tạm (`Deactivated`) và phát
        domain event để gửi thông báo kết quả (kèm lý do) cho người xin gia nhập.
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            example: REQ12345678901234
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejectionReason]
              properties:
                rejectionReason:
                  type: string
                  maxLength: 500
                  example: Thông tin gia phả đề xuất không khớp với phả hệ thực tế
      responses:
        '200':
          description: Đã từ chối, trả về yêu cầu kèm lý do
        '400':
          description: Lý do trống/ quá 500 ký tự, hoặc yêu cầu đã được xử lý
        '404':
          description: Yêu cầu không tồn tại trong dòng họ hiện hành

  /contributions/cash:
    post:
      summary: Ghi nhận đóng góp bằng tiền mặt hoặc chuyển khoản & cấp phiếu thu điện tử (US-09)
      description: |
        Tiếp nhận khoản đóng góp tại sự kiện, tự động sinh mã phiếu thu duy nhất (PT-YYYYMMDD-XXXXX),
        và phân bổ tỷ lệ công đức vào contribution_member_details phục vụ tính toán đệ quy US-11.
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventId
                - payerMemberId
                - amount
                - paymentMethod
              properties:
                eventId:
                  type: string
                  example: EVT20261029ABC
                payerMemberId:
                  type: string
                  example: MEM01J0001
                amount:
                  type: number
                  format: double
                  example: 1000000
                paymentMethod:
                  type: string
                  enum: [Cash, BankTransfer]
                  example: Cash
                allocations:
                  type: array
                  items:
                    type: object
                    required:
                      - memberId
                      - amount
                    properties:
                      memberId:
                        type: string
                        example: MEM01J0002
                      amount:
                        type: number
                        format: double
                        example: 500000
      responses:
        '201':
          description: Ghi nhận đóng góp và cấp phiếu thu điện tử thành công
        '400':
          description: Dữ liệu không hợp lệ hoặc tổng phân bổ không khớp
        '403':
          description: Không có quyền thủ quỹ hoặc sự kiện đã đóng
        '404':
          description: Sự kiện hoặc thành viên không tồn tại

  /contributions/cash/receipts/{receiptNumber}:
    get:
      summary: Tra cứu phiếu thu điện tử theo mã số biên lai (US-09)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: receiptNumber
          in: path
          required: true
          schema:
            type: string
            example: PT-20261029-A1B2C3
      responses:
        '200':
          description: Tra cứu phiếu thu điện tử thành công
        '404':
          description: Không tìm thấy biên lai

  /events/{eventId}/benchmarks:
    post:
      summary: Ban hành định mức giá hiện vật cúng tiến của sự kiện (US-10, Task #72)
      description: |
        Ban tổ chức (HeadOfOrganizer, EventTreasurer) hoặc Trưởng tộc/Admin thiết lập đơn giá định mức
        cho các hiện vật cúng tiến phổ biến (heo quay, mâm xôi, gà luộc, v.v.) trong sự kiện.
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT20261029ABC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventItemBenchmarkRequest'
      responses:
        '201':
          description: Tạo định mức giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEventItemBenchmark'
        '400':
          description: Dữ liệu không hợp lệ hoặc đã tồn tại định mức cho vật phẩm này
        '403':
          description: Không có quyền thiết lập định mức
        '404':
          description: Sự kiện không tồn tại
    get:
      summary: Lấy danh sách định mức giá hiện vật theo sự kiện (US-10, Task #72)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT20261029ABC
      responses:
        '200':
          description: Danh sách định mức giá hiện vật
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Event item benchmarks retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventItemBenchmarkResponse'

  /events/{eventId}/benchmarks/{benchmarkId}:
    delete:
      summary: Xóa định mức giá hiện vật của sự kiện (US-10, Task #72)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT20261029ABC
        - name: benchmarkId
          in: path
          required: true
          schema:
            type: string
            example: BM20261031A1B2C3D4
      responses:
        '200':
          description: Xóa định mức giá thành công
        '403':
          description: Không có quyền xóa định mức
        '404':
          description: Sự kiện hoặc định mức không tồn tại

  /contributions/in-kind:
    post:
      summary: Tiếp nhận hiện vật cúng tiến & quy đổi giá trị tương đương (US-10, Task #72, #74)
      description: |
        Tiếp nhận hiện vật cúng tiến (heo quay, mâm quả, lư hương...), tự động tính giá trị tiền mặt quy đổi tương đương
        theo phương thức BTC Benchmark, Invoice (đối soát thực tế), hoặc Agreement (thỏa thuận),
        đồng thời cấp mã phiếu thu điện tử duy nhất (PT-YYYYMMDD-XXXXX) và khởi tạo trạng thái vòng đời là Pending.
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInKindContributionRequest'
      responses:
        '201':
          description: Tiếp nhận hiện vật và cấp biên lai điện tử thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInKindReceipt'
        '400':
          description: Dữ liệu không hợp lệ hoặc thiếu thông tin quy đổi
        '403':
          description: Không có quyền tiếp nhận hiện vật
        '404':
          description: Sự kiện hoặc thành viên không tồn tại

  /contributions/in-kind/{id}:
    get:
      summary: Xem chi tiết đóng góp hiện vật cúng tiến (US-10, Task #72)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: CTB20261031ABC12345
      responses:
        '200':
          description: Lấy chi tiết hiện vật cúng tiến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInKindContributionDetail'
        '404':
          description: Không tìm thấy hiện vật cúng tiến

  /contributions/in-kind/receipts/{receiptNumber}:
    get:
      summary: Tra cứu phiếu thu điện tử hiện vật theo mã số biên lai (US-10, Task #74)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: receiptNumber
          in: path
          required: true
          schema:
            type: string
            example: PT-20261031-K9L8M7
      responses:
        '200':
          description: Tra cứu phiếu thu điện tử hiện vật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInKindReceipt'
        '404':
          description: Không tìm thấy biên lai

  /contributions/in-kind/{id}/lifecycle:
    put:
      summary: Phân loại vòng đời hiện vật cúng tiến sau sự kiện (US-10, Task #73)
      description: |
        Phân loại hiện vật sau sự kiện:
        - Consumed (Tiêu hao tại cỗ/sự kiện)
        - Returned (Hoàn trả cho người dâng cúng)
        - AddedToCommonAssets (Tự động kết chuyển vào danh mục tài sản chung dòng họ - clan_assets)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: CTB20261031ABC12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessInKindLifecycleRequest'
      responses:
        '200':
          description: Xử lý vòng đời hiện vật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProcessInKindLifecycle'
        '400':
          description: Hiện vật đã được xử lý hoặc dữ liệu vị trí lưu trữ không hợp lệ
        '403':
          description: Không có quyền phân loại vòng đời
        '404':
          description: Không tìm thấy hiện vật

  /contributions/in-kind/events/{eventId}:
    get:
      summary: Danh sách tất cả hiện vật cúng tiến theo sự kiện (US-10, Task #73)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT20261029ABC
      responses:
        '200':
          description: Danh sách hiện vật cúng tiến
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Event in-kind contributions retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InKindContributionDetailResponse'

  /clan-assets:
    get:
      summary: Danh sách tài sản tích lũy chung của dòng họ có phân trang & tìm kiếm (US-10, Task #73, #74)
      description: |
        Truy xuất danh mục tài sản lâu bền của dòng họ (đồ thờ, bàn ghế, lư đồng, v.v.),
        hỗ trợ tìm kiếm theo tên tài sản và phân trang.
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            example: "Lư đồng"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách tài sản dòng họ phân trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClanAssetSummary'

  /clan-assets/{id}:
    get:
      summary: Chi tiết tài sản dòng họ (US-10, Task #73)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: AST20261031ABC12345
      responses:
        '200':
          description: Chi tiết tài sản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClanAsset'
        '404':
          description: Tài sản không tồn tại

  /roles/assign:
    post:
      summary: Chỉ định vai trò Trưởng nhánh hoặc nhân sự sự kiện (US-03)
      description: |
        Chỉ Trưởng tộc (ROLE_CLAN_HEAD) hoặc Admin (ROLE_ADMIN) có quyền thực hiện.
        Với Trưởng nhánh (ROLE_BRANCH_HEAD): gắn representative_id vào family_branches và gắn vào account_roles (bắt buộc thành viên đã có tài khoản Active).
        Với nhân sự sự kiện (HeadOfOrganizer, OrganizerMember, EventTreasurer): cập nhật bảng event_personnel.
        Tự động phát thông báo bất đồng bộ và ghi vào audit_logs.
      tags:
        - Role Management (Dual-RBAC)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - memberId
                - roleCode
                - scopeType
                - scopeId
              properties:
                memberId:
                  type: string
                  example: MEM20261016A1B2C3
                roleCode:
                  type: string
                  enum: [ROLE_BRANCH_HEAD, HeadOfOrganizer, OrganizerMember, EventTreasurer]
                  example: ROLE_BRANCH_HEAD
                scopeType:
                  type: string
                  enum: [BRANCH, EVENT]
                  example: BRANCH
                scopeId:
                  type: string
                  example: BR_CHI_1
                description:
                  type: string
                  example: Bổ nhiệm Trưởng chi nhánh
      responses:
        '200':
          description: Chỉ định vai trò thành công
        '400':
          description: Dữ liệu không hợp lệ hoặc thành viên chưa có tài khoản Active
        '403':
          description: Không có quyền truy cập
        '404':
          description: Không tìm thấy thành viên, chi nhánh hoặc sự kiện

  /roles/revoke:
    post:
      summary: Thu hồi vai trò Trưởng nhánh hoặc nhân sự sự kiện (US-03)
      description: |
        Chỉ Trưởng tộc hoặc Admin có quyền thực hiện.
        Thu hồi Trưởng nhánh sẽ gỡ representative_id và gỡ ROLE_BRANCH_HEAD khỏi account_roles (nếu không còn nhánh nào khác).
        Thu hồi nhân sự sự kiện sẽ xóa bản ghi khỏi event_personnel.
        Tự động ghi audit_logs và phát thông báo.
      tags:
        - Role Management (Dual-RBAC)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - memberId
                - roleCode
                - scopeType
                - scopeId
              properties:
                memberId:
                  type: string
                  example: MEM20261016A1B2C3
                roleCode:
                  type: string
                  enum: [ROLE_BRANCH_HEAD, HeadOfOrganizer, OrganizerMember, EventTreasurer]
                  example: ROLE_BRANCH_HEAD
                scopeType:
                  type: string
                  enum: [BRANCH, EVENT]
                  example: BRANCH
                scopeId:
                  type: string
                  example: BR_CHI_1
                reason:
                  type: string
                  example: Thay đổi nhân sự
      responses:
        '200':
          description: Thu hồi vai trò thành công
        '400':
          description: Dữ liệu không hợp lệ
        '403':
          description: Không có quyền truy cập

  /roles/audit-logs:
    get:
      summary: Tra cứu nhật ký kiểm toán phân quyền (US-03)
      tags:
        - Role Management (Dual-RBAC)
      security:
        - BearerAuth: []
      parameters:
        - name: memberId
          in: query
          required: false
          schema:
            type: string
        - name: scopeType
          in: query
          required: false
          schema:
            type: string
            enum: [BRANCH, EVENT]
        - name: scopeId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Danh sách nhật ký kiểm toán

  /roles/overview:
    get:
      summary: Lấy dữ liệu tổng hợp phân quyền dòng họ (US-03)
      tags:
        - Role Management (Dual-RBAC)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tổng quan phân quyền nhánh và thành viên

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Nhập JWT Access Token nhận được từ API /auth/login.
        Token tự động đính kèm quyền hạn ROLE_CLAN_HEAD và clanId cho người tạo cây.

  schemas:
    UpdateInvitationRequest:
      type: object
      description: |
        Payload cập nhật / tái tạo mã mời. Mọi trường đều tuỳ chọn nhưng phải có ít nhất một trường khi cập nhật.
      properties:
        isActive:
          type: boolean
          description: Bật/tắt hiệu lực của mã (false = thu hồi nhưng vẫn giữ bản ghi).
        expiresAt:
          type: string
          format: date-time
          description: Mốc hết hạn tuyệt đối, phải ở tương lai.
        validityDays:
          type: integer
          minimum: 1
          description: Số ngày hiệu lực tính từ lúc gọi, dùng khi không truyền `expiresAt`.
        maxUses:
          type: integer
          minimum: 1
          description: Số lượt sử dụng tối đa; không được nhỏ hơn `usedCount` hiện tại.

    ApproveJoinRequest:
      type: object
      description: |
        Nội dung tuỳ chọn khi phê duyệt, cho phép người duyệt chỉnh lại vị trí trước khi tạo hồ sơ.
      properties:
        targetBranchId:
          type: string
          maxLength: 20
          description: |
            Nhánh thực tế gán hồ sơ (ExistingBranchLeaf) hoặc nhánh cha của chi nhánh mới (NewChildBranch).
            Bỏ trống để dùng vị trí ứng viên đề xuất.
          example: BR_CHI_2
        proposedNewBranchName:
          type: string
          maxLength: 100
          description: Tên chi nhánh mới nếu muốn đổi, chỉ hợp lệ với `NewChildBranch`.
          example: Chi 3 - Nhánh Ất

    ApiResponseInviteCode:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            inviteCode:
              type: string
            clanId:
              type: string
            inviteType:
              type: string
              enum: [GeneralClanInvite, PositionLinkCode]
            shareableUrl:
              type: string
            targetBranchId:
              type: string
            maxUses:
              type: integer
            usedCount:
              type: integer
            expiresAt:
              type: string
              format: date-time
            isActive:
              type: boolean
        timestamp:
          type: string
          format: date-time

    UpdateLifeStatusRequest:
      type: object
      description: |
        Payload cập nhật tình trạng sinh/tử của thành viên (US-27).
        Khi chọn `Deceased`, trường `deathDate` là bắt buộc và phải là ngày trong quá khứ hoặc hiện tại.
      required:
        - status
      properties:
        status:
          type: string
          enum: [Living, Deceased]
          description: Tình trạng thành viên (Living hoặc Deceased)
          example: Deceased
        deathDate:
          type: string
          format: date
          description: Ngày mất Dương lịch (bắt buộc khi status là Deceased, <= ngày hiện tại và >= ngày sinh)
          example: '2024-03-24'
        burialPlace:
          type: string
          maxLength: 255
          description: Nơi an táng, phần mộ hoặc nghĩa trang yên nghỉ
          example: 'Khu lăng mộ tổ họ Nguyễn, xã Đông Kết, Khoái Châu, Hưng Yên'

    CreateMemberRequest:
      type: object
      description: |
        Payload tạo thành viên. `branchId` KHÔNG nằm trong body (lấy từ path variable).
        `memberId`, `isPlaceholder`, `createdAt` do server sinh và bị bỏ qua nếu client gửi lên.
      required:
        - fullName
        - gender
        - generation
      properties:
        fullName:
          type: string
          maxLength: 100
          description: "`members.full_name` VARCHAR(100) NOT NULL"
          example: Nguyễn Văn An
        dateOfBirth:
          type: string
          format: date
          description: "`members.date_of_birth` DATE, không được ở tương lai"
          example: "1990-05-20"
        gender:
          type: string
          enum: [Male, Female, Other]
          description: "`members.gender` CHECK (Male|Female|Other)"
          example: Male
        generation:
          type: integer
          minimum: 1
          description: "`members.generation` INT NOT NULL CHECK >= 1; không nhỏ hơn `generation_level` của chi/nhánh"
          example: 3
        status:
          type: string
          enum: [Living, Deceased]
          default: Living
          description: "`members.status` VARCHAR(20) NOT NULL DEFAULT 'Living'; bỏ trống thì mặc định Living"
          example: Living
        deathDateLunar:
          type: string
          maxLength: 50
          description: "`members.death_date_lunar` VARCHAR(50)"
          example: "15/08 Âm lịch"

    MemberResponse:
      type: object
      description: Read model của bảng `members`; `branchName` và `clanId` phân giải qua `family_branches`.
      properties:
        memberId:
          type: string
          maxLength: 20
          example: MEMK4F8ZQ1M7XB3QP
        fullName:
          type: string
          example: Nguyễn Văn An
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: "1990-05-20"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: Male
        generation:
          type: integer
          example: 3
        status:
          type: string
          enum: [Living, Deceased]
          example: Living
        deathDate:
          type: string
          format: date
          nullable: true
          description: Ngày mất Dương lịch (US-27)
          example: "2024-03-24"
        deathDateLunar:
          type: string
          nullable: true
          example: "15/02 Giáp Thìn"
        burialPlace:
          type: string
          nullable: true
          description: Nơi an táng, phần mộ (US-27)
          example: "Khu lăng mộ tổ họ Nguyễn"
        branchId:
          type: string
          example: BR_CHILD_1
        branchName:
          type: string
          example: Chi Hai
        clanId:
          type: string
          example: CLAN_DEFAULT
        isPlaceholder:
          type: boolean
          description: Luôn `true` với hồ sơ do quản lý tạo (chờ nhận liên kết ở US-18).
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-10-23T15:00:00Z"

    CreateVirtualMemberRequest:
      type: object
      description: |
        Payload tạo hồ sơ ảo + mã liên kết vị trí (US-18). `branchId` KHÔNG nằm trong body (lấy từ path variable).
        `memberId`, `isPlaceholder`, `inviteCode`, `maxUses`, `usedCount`, `createdAt` do server quyết định.
      required:
        - fullName
        - gender
        - generation
      properties:
        fullName:
          type: string
          maxLength: 100
          description: "`members.full_name` VARCHAR(100) NOT NULL"
          example: Nguyễn Văn An
        dateOfBirth:
          type: string
          format: date
          description: "`members.date_of_birth` DATE, không được ở tương lai"
          example: "1990-05-20"
        gender:
          type: string
          enum: [Male, Female, Other]
          description: "`members.gender` CHECK (Male|Female|Other)"
          example: Male
        generation:
          type: integer
          minimum: 1
          description: "`members.generation` INT NOT NULL CHECK >= 1; không nhỏ hơn `generation_level` của chi/nhánh"
          example: 3
        status:
          type: string
          enum: [Living, Deceased]
          default: Living
          description: "`members.status` VARCHAR(20) NOT NULL DEFAULT 'Living'; bỏ trống thì mặc định Living"
          example: Living
        deathDateLunar:
          type: string
          maxLength: 50
          description: "`members.death_date_lunar` VARCHAR(50)"
          example: "15/08 Âm lịch"
        expiresAt:
          type: string
          format: date-time
          description: "`invitation_codes.expires_at`; phải ở tương lai. Nếu bỏ trống thì dùng `validityDays`."
          example: "2026-11-30T00:00:00Z"
        validityDays:
          type: integer
          minimum: 1
          maximum: 365
          description: Số ngày hiệu lực của mã liên kết khi không truyền `expiresAt`. Mặc định 7 ngày.
          example: 7

    PositionLinkCode:
      type: object
      description: |
        Mã liên kết vị trí dùng một lần (`invitation_codes` với `invite_type = 'PositionLinkCode'`).
        Bản ghi luôn có `max_uses = 1`, `used_count = 0` khi vừa tạo, và `target_member_id` trỏ tới hồ sơ ảo.
      properties:
        inviteCode:
          type: string
          maxLength: 30
          description: "`invitation_codes.invite_code` PRIMARY KEY (8 ký tự Base32 CSPRNG)"
          example: 8K9P2X7N
        clanId:
          type: string
          example: CLAN_DEFAULT
        clanName:
          type: string
          example: Dòng Họ Nguyễn
        inviteType:
          type: string
          enum: [GeneralClanInvite, PositionLinkCode]
          example: PositionLinkCode
        shareableUrl:
          type: string
          description: Link chia sẻ để người nhận vị trí mở và liên kết tài khoản (`app.invitation.position-link-base-url`).
          example: "http://localhost:3000/position-link?code=8K9P2X7N"
        targetBranchId:
          type: string
          example: BR_CHI_2
        targetBranchName:
          type: string
          example: Chi 2 - Nhánh Giáp
        targetMemberId:
          type: string
          description: "`invitation_codes.target_member_id` UNIQUE - trỏ tới hồ sơ ảo vừa tạo."
          example: MEMK4F8ZQ1M7XB3QP
        maxUses:
          type: integer
          description: Luôn `1` với PositionLinkCode.
          example: 1
        usedCount:
          type: integer
          description: Số lần đã dùng; `1` nghĩa là mã đã bị dùng hết.
          example: 0
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-11-07T09:00:00Z"
        isActive:
          type: boolean
          example: true
        createdByAccountId:
          type: string
          example: ACC_TRUONG_TOC
        createdAt:
          type: string
          format: date-time
          example: "2026-10-31T09:00:00Z"

    VirtualMemberPosition:
      type: object
      description: |
        Kết quả của US-18: hồ sơ ảo (vị trí lá, `isPlaceholder = true`, chưa có tài khoản) và mã liên kết
        vị trí dùng một lần được phát hành cho chính vị trí đó.
      properties:
        member:
          $ref: '#/components/schemas/MemberResponse'
        positionLinkCode:
          $ref: '#/components/schemas/PositionLinkCode'

    ApiResponseMember:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Member created successfully
        data:
          $ref: '#/components/schemas/MemberResponse'
        timestamp:
          type: string
          format: date-time

    ApiResponseVirtualMember:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Tạo hồ sơ ảo và mã liên kết vị trí thành công
        data:
          $ref: '#/components/schemas/VirtualMemberPosition'
        timestamp:
          type: string
          format: date-time

    ClaimPositionRequest:
      type: object
      description: |-
        Payload đăng ký kèm mã liên kết vị trí (`POST /position-links/{inviteCode}/claim`, US-19).
        Cặp `phoneNumber` + `password` là bằng chứng danh tính của người nhận vị trí; hồ sơ phả hệ (họ tên, đời,
        chi/nhánh) **không** truyền lại vì đã tồn tại trên vị trí ảo do US-18 tạo.
      required: [phoneNumber, password]
      properties:
        phoneNumber:
          type: string
          pattern: '^(0|\+84)[0-9]{9,10}$'
          description: "`user_accounts.phone_number` VARCHAR(15) NOT NULL UNIQUE - cũng là `loginIdentifier` của /auth/login"
          example: 0912345678
        password:
          type: string
          minLength: 6
          maxLength: 50
          description: "Mật khẩu (lưu dạng BCrypt trong `user_accounts.password_hash`)"
          example: secret123
        email:
          type: string
          format: email
          maxLength: 100
          nullable: true
          description: "`user_accounts.email` VARCHAR(100) UNIQUE - tuỳ chọn, chỉ dùng khi tạo tài khoản mới"
          example: ut@example.com

    ClaimPositionResponse:
      type: object
      description: |-
        Kết quả của US-19: tài khoản đã được liên kết với vị trí ảo và kích hoạt (`Active`), vị trí đã thôi là
        placeholder. Người dùng đăng nhập được ngay bằng số điện thoại + mật khẩu vừa dùng.
      properties:
        accountId:
          type: string
          example: ACC_7F3D9A0B1C2E
        phoneNumber:
          type: string
          example: 0912345678
        email:
          type: string
          nullable: true
          example: ut@example.com
        accountStatus:
          type: string
          enum: [Active]
          description: Luôn `Active` sau khi liên kết thành công (mã đúng thay cho bước phê duyệt).
          example: Active
        roles:
          type: array
          items:
            type: string
          example: [ROLE_MEMBER]
        memberId:
          type: string
          description: "`members.member_id` của vị trí vừa nhận"
          example: MEMK4F8ZQ1M7XB3QP
        fullName:
          type: string
          description: Họ tên đã ghi trên vị trí ảo (không nhập lại khi đăng ký)
          example: Nguyễn Văn Út
        generation:
          type: integer
          example: 4
        branchId:
          type: string
          description: "`members.branch_id` - chi/nhánh mà tài khoản được nối vào"
          example: BR_CHI_2
        branchName:
          type: string
          example: Chi 2 - Nhánh Giáp
        clanId:
          type: string
          example: CLAN_DEFAULT
        clanName:
          type: string
          example: Dòng Họ Nguyễn
        inviteCode:
          type: string
          description: Mã đã dùng (không thể dùng lại)
          example: 8K9P2X7N
        linkedAt:
          type: string
          format: date-time
          example: "2026-11-01T09:00:00Z"

    PositionLinkPreviewResponse:
      type: object
      description: |-
        Kết quả xem trước của US-19: dòng họ, chi/nhánh và hồ sơ mà mã liên kết vị trí đang trỏ tới. Chỉ trả về
        khi mã còn dùng được (chưa dùng, chưa bị vô hiệu hoá, chưa hết hạn).
      properties:
