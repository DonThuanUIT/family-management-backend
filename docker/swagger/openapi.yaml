    ApiResponseInKindContributionDetail:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: In-kind contribution retrieved successfully
        data:
          $ref: '#/components/schemas/InKindContributionDetailResponse'

    ProcessInKindLifecycleRequest:
