openapi: 3.0.3
info:
  title: Family Management Fund API (familyfund-api)
  version: 1.0.0
  description: |
    Core RESTful API documentation for Family Management Backend system.
    Supports Family Tree Management, Event Planning & Registration, Advance/Settlement Vouchers,
    Immutable Ledgers (Audit Trail), and Multi-channel Contributions.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Spring Boot Backend Server
paths:
  /auth/register-creator:
    post:
      summary: Đăng ký tài khoản người khởi tạo & tạo dòng họ mới (US-01)
      description: |
        Khởi tạo tài khoản người dùng, tạo một dòng họ mới (Multi-tenant), dựng nhánh gốc (Root Branch)
        của cây phả hệ, tạo hồ sơ Thủy tổ (nếu có) và hồ sơ thành viên người khởi tạo với vai trò ROLE_CLAN_HEAD.
      tags:
        - Authentication
        - Clan & Family Tree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clanName
                - fullName
                - phoneNumber
                - password
                - gender
              properties:
                clanName:
                  type: string
                  example: Dòng họ Nguyễn Văn
                ancestorName:
                  type: string
                  example: Cụ Tổ Nguyễn Văn Khởi
                originLocation:
                  type: string
                  example: Hà Nam, Việt Nam
                establishedYear:
                  type: integer
                  example: 1820
                description:
                  type: string
                  example: Chi họ khởi tổ tại Hà Nam
                fullName:
                  type: string
                  example: Nguyễn Văn An
                phoneNumber:
                  type: string
                  example: "0987654321"
                password:
                  type: string
                  format: password
                  example: SecurePassword123
                gender:
                  type: string
                  enum: [Male, Female, Other]
                  example: Male
                email:
                  type: string
                  format: email
                  example: nguyenvanan@example.com
                dateOfBirth:
                  type: string
                  format: date
                  example: 1985-05-15
                generation:
                  type: integer
                  example: 6
      responses:
        '201':
          description: Đăng ký và khởi tạo dòng họ thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đăng ký người khởi tạo và tạo dòng họ mới thành công
                  data:
                    type: object
                    properties:
                      account:
                        type: object
                        properties:
                          accountId:
                            type: string
                            example: ACC_9A8B7C6D
                          phoneNumber:
                            type: string
                            example: "0987654321"
                          email:
                            type: string
                            example: nguyenvanan@example.com
                          accountStatus:
                            type: string
                            example: Active
                          roles:
                            type: array
                            items:
                              type: string
                            example: [ROLE_CLAN_HEAD]
                          createdAt:
                            type: string
                            format: date-time
                      clan:
                        type: object
                        properties:
                          clanId:
                            type: string
                            example: CLAN_F1E2D3C4
                          clanName:
                            type: string
                            example: Dòng họ Nguyễn Văn
                          ancestorName:
                            type: string
                            example: Cụ Tổ Nguyễn Văn Khởi
                          originLocation:
                            type: string
                            example: Hà Nam, Việt Nam
                          establishedYear:
                            type: integer
                            example: 1820
                          description:
                            type: string
                            example: Chi họ khởi tổ tại Hà Nam
                      member:
                        type: object
                        properties:
                          memberId:
                            type: string
                            example: MEM_4B3A2C1D
                          fullName:
                            type: string
                            example: Nguyễn Văn An
                          gender:
                            type: string
                            example: Male
                          generation:
                            type: integer
                            example: 6
                          dateOfBirth:
                            type: string
                            format: date
                            example: 1985-05-15
                          branchId:
                            type: string
                            example: BR_1234ABCD
        '400':
          description: Dữ liệu không hợp lệ hoặc số điện thoại / email đã tồn tại
  /auth/login:
    post:
      summary: Đăng nhập hệ thống
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginIdentifier
                - password
              properties:
                loginIdentifier:
                  type: string
                  example: admin_hoang
                password:
                  type: string
                  format: password
                  example: Admin@123
      responses:
        '200':
          description: Đăng nhập thành công, trả về JWT Token và thông tin tài khoản
        '401':
          description: Sai thông tin đăng nhập

  /clans:
    get:
      summary: Lấy danh sách dòng họ (Multi-tenant)
      tags:
        - Clan & Family Tree
      responses:
        '200':
          description: Danh sách dòng họ
    post:
      summary: Khởi tạo dòng họ mới
      tags:
        - Clan & Family Tree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clanName
              properties:
                clanName:
                  type: string
                  example: Dòng họ Nguyễn Trọng
                establishedDate:
                  type: string
                  format: date
                  example: 1850-01-01
                inviteCode:
                  type: string
                  example: CLAN-NGUYEN-1850
      responses:
        '201':
          description: Tạo thành công

  /clans/{clanId}/members:
    get:
      summary: Lấy danh sách thành viên trong dòng họ
      tags:
        - Clan & Family Tree
      parameters:
        - name: clanId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách thành viên

  /branches/{branchId}/members:
    post:
      summary: Tạo hồ sơ thành viên mới trong một chi/nhánh (US-03)
      description: |
        Tạo hồ sơ thành viên (`members`) gắn với chi/nhánh nêu trong đường dẫn, thuộc dòng họ hiện hành
        (multi-tenant: header `X-Clan-Id` hoặc query param `clanId`, mặc định `CLAN_DEFAULT`).

        Quy tắc nghiệp vụ:
        - `branchId` **chỉ** lấy từ đường dẫn, không truyền lại trong body.
        - `memberId` do server sinh (`MEM` + timestamp Base36 + hậu tố CSPRNG, tối đa 20 ký tự).
        - `isPlaceholder` luôn được server đặt `true` (hồ sơ chờ tài khoản người dùng nhận liên kết - US-18).
        - Chống trùng hồ sơ trong cùng dòng họ theo bộ (`fullName` không phân biệt hoa thường, `gender`, `generation`, `dateOfBirth`).
        - `generation` không được nhỏ hơn `generation_level` của chi/nhánh.
      tags:
        - Clan & Family Tree
      security:
        - BearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          description: Mã chi/nhánh thuộc dòng họ hiện hành (`family_branches.branch_id`, VARCHAR(20))
          schema:
            type: string
            maxLength: 20
            example: BR_CHILD_1
        - name: X-Clan-Id
          in: header
          required: false
          description: Mã dòng họ hiện hành (multi-tenant). Bỏ trống sẽ dùng `CLAN_DEFAULT`.
          schema:
            type: string
            example: CLAN_DEFAULT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: Tạo thành viên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMember'
        '400':
          description: Payload sai ràng buộc schema, `branchId` sai định dạng, hoặc thế hệ thấp hơn cấp của chi/nhánh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '403':
          description: Không có quyền (chỉ `ROLE_CLAN_HEAD`, `ROLE_BRANCH_HEAD`, `ROLE_ADMIN`; Trưởng chi chỉ được thêm vào chi mình quản lý)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Dòng họ hoặc chi/nhánh không tồn tại trong dòng họ hiện hành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '409':
          description: Hồ sơ trùng với thành viên đã có trong dòng họ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /events:
    get:
      summary: Danh sách sự kiện của dòng họ
      tags:
        - Events & Registration
      responses:
        '200':
          description: Danh sách sự kiện
    post:
      summary: Khởi tạo kế hoạch sự kiện mới (US-21)
      tags:
        - Events & Registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventName
                - eventDatetime
                - location
              properties:
                eventName:
                  type: string
                  example: Giỗ Tổ 2026
                eventDatetime:
                  type: string
                  format: date-time
                  example: "2026-04-26T08:00:00Z"
                eventDateLunar:
                  type: string
                  example: "10/03 Bính Ngọ"
                location:
                  type: string
                  example: Nhà thờ tổ Chi 1
                estimatedBudget:
                  type: number
                  example: 50000000.00
                description:
                  type: string
                  example: Lễ giỗ tổ truyền thống dòng họ
      responses:
        '201':
          description: Tạo sự kiện thành công

  /events/{eventId}:
    get:
      summary: Xem chi tiết sự kiện và ban tổ chức (US-21)
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT_20260426
      responses:
        '200':
          description: Chi tiết sự kiện
    put:
      summary: Cập nhật thông tin và lịch trình sự kiện (US-22)
      description: |
        Cập nhật thông tin sự kiện. Tự động so sánh lịch trình cũ và mới (ngày giờ, địa điểm) để phát thông báo biến động tới con cháu.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventName
                - eventDatetime
                - location
              properties:
                eventName:
                  type: string
                  example: Giỗ Tổ 2026 (Điều chỉnh)
                eventDatetime:
                  type: string
                  format: date-time
                  example: "2026-04-27T08:00:00Z"
                eventDateLunar:
                  type: string
                  example: "11/03 Bính Ngọ"
                location:
                  type: string
                  example: Từ đường Đại Tộc
                estimatedBudget:
                  type: number
                  example: 55000000.00
                description:
                  type: string
                  example: Cập nhật địa điểm sang từ đường lớn
      responses:
        '200':
          description: Cập nhật thông tin sự kiện thành công

  /events/{eventId}/status:
    patch:
      summary: Chuyển đổi trạng thái vòng đời sự kiện (US-21)
      description: |
        Quản lý chuyển đổi trạng thái vòng đời: Draft -> RegistrationOpen -> RegistrationClosed -> Ongoing -> Ended -> Closed.
        Được bảo vệ bởi @PreAuthorize("hasAnyRole('CLAN_HEAD', 'ADMIN') or @nhanSuSuKien.xacThucQuyenTheoNguCanh(#eventId, 'HeadOfOrganizer')").
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Draft, RegistrationOpen, RegistrationClosed, Ongoing, Ended, Closed]
                  example: RegistrationOpen
      responses:
        '200':
          description: Cập nhật trạng thái sự kiện thành công

  /events/{eventId}/personnel:
    post:
      summary: Chỉ định Ban tổ chức và Thủ quỹ sự kiện (US-21)
      description: |
        Trưởng tộc chỉ định nhân sự gắn riêng với sự kiện. Ràng buộc: tối đa 1 HeadOfOrganizer, 1 EventTreasurer, không giới hạn OrganizerMember.
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - personnel
              properties:
                personnel:
                  type: array
                  items:
                    type: object
                    required:
                      - memberId
                      - role
                    properties:
                      memberId:
                        type: string
                        example: MEM_001
                      role:
                        type: string
                        enum: [HeadOfOrganizer, EventTreasurer, OrganizerMember]
                        example: HeadOfOrganizer
      responses:
        '200':
          description: Chỉ định nhân sự thành công

  /events/{eventId}/notifications:
    get:
      summary: Xem lịch sử thông báo đã phát của sự kiện (US-22)
      tags:
        - Events & Registration
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách thông báo sự kiện

  /events/{eventId}/advance-vouchers:
    post:
      summary: Lập phiếu cấp phát kinh phí tạm ứng (Phân hệ 3)
      tags:
        - Finance & Vouchers
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - taskId
                - recipientMemberId
                - advanceAmount
                - receivedDate
                - settlementDeadline
              properties:
                taskId:
                  type: string
                  example: TASK_001
                recipientMemberId:
                  type: string
                  example: MEM_001
                advanceAmount:
                  type: number
                  example: 5000000.00
                receivedDate:
                  type: string
                  format: date-time
                settlementDeadline:
                  type: string
                  format: date-time
                commitmentNotes:
                  type: string
                  example: Chi phí mua hoa quả, bánh kẹo
      responses:
        '201':
          description: Lập phiếu tạm ứng thành công

  /events/{eventId}/contributions:
    post:
      summary: Tiếp nhận đóng góp / cúng tiến (Tiền mặt hoặc Hiện vật)
      tags:
        - Contributions & Assets
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payerMemberId
                - contributionType
                - memberAllocations
              properties:
                payerMemberId:
                  type: string
                  example: MEM_001
                contributionType:
                  type: string
                  enum: [Cash, InKind]
                  example: Cash
                cashDetail:
                  type: object
                  properties:
                    amount:
                      type: number
                      example: 2000000.00
                    paymentMethod:
                      type: string
                      enum: [Cash, BankTransfer]
                      example: BankTransfer
                    receiptNumber:
                      type: string
                      example: REC-2026-0001
                memberAllocations:
                  type: array
                  items:
                    type: object
                    required:
                      - memberId
                      - recordedAmount
                    properties:
                      memberId:
                        type: string
                        example: MEM_001
                      recordedAmount:
                        type: number
                        example: 2000000.00
      responses:
        '201':
          description: Ghi nhận đóng góp thành công

  /ledger/immutable:
    get:
      summary: Tra cứu Sổ cái Quỹ chung bất biến (Audit Trail NFR-01)
      tags:
        - Finance & Vouchers
      parameters:
        - name: eventId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Danh sách các bút toán sổ cái bất biến

  /invitations/general:
    post:
      summary: Tạo mã mời chung gia phả (US-16)
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetBranchId:
                  type: string
                  example: BRANCH_ROOT
                maxUses:
                  type: integer
                  example: 100
                validityDays:
                  type: integer
                  example: 30
      responses:
        '201':
          description: Tạo mã mời thành công
        '400':
          description: Tham số không hợp lệ
        '403':
          description: Không có quyền (chỉ dành cho ROLE_CLAN_HEAD hoặc ROLE_ADMIN)
    get:
      summary: Lấy danh sách các mã mời chung đang hoạt động
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách mã mời chung

  /invitations/{inviteCode}:
    get:
      summary: Xem chi tiết thông tin mã mời (Public cho trang đón tiếp US-17)
      tags:
        - Invitations & Onboarding
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
            example: 8K9P2X7N
      responses:
        '200':
          description: Thông tin mã mời
        '404':
          description: Mã mời không tồn tại hoặc đã bị vô hiệu hóa

  /invitations/{inviteCode}/deactivate:
    patch:
      summary: Vô hiệu hóa mã mời sớm
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vô hiệu hóa thành công
        '403':
          description: Không có quyền thực hiện

  /contributions/cash:
    post:
      summary: Ghi nhận đóng góp bằng tiền mặt hoặc chuyển khoản & cấp phiếu thu điện tử (US-09)
      description: |
        Tiếp nhận khoản đóng góp tại sự kiện, tự động sinh mã phiếu thu duy nhất (PT-YYYYMMDD-XXXXX),
        và phân bổ tỷ lệ công đức vào contribution_member_details phục vụ tính toán đệ quy US-11.
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventId
                - payerMemberId
                - amount
                - paymentMethod
              properties:
                eventId:
                  type: string
                  example: EVT20261029ABC
                payerMemberId:
                  type: string
                  example: MEM01J0001
                amount:
                  type: number
                  format: double
                  example: 1000000
                paymentMethod:
                  type: string
                  enum: [Cash, BankTransfer]
                  example: Cash
                allocations:
                  type: array
                  items:
                    type: object
                    required:
                      - memberId
                      - amount
                    properties:
                      memberId:
                        type: string
                        example: MEM01J0002
                      amount:
                        type: number
                        format: double
                        example: 500000
      responses:
        '201':
          description: Ghi nhận đóng góp và cấp phiếu thu điện tử thành công
        '400':
          description: Dữ liệu không hợp lệ hoặc tổng phân bổ không khớp
        '403':
          description: Không có quyền thủ quỹ hoặc sự kiện đã đóng
        '404':
          description: Sự kiện hoặc thành viên không tồn tại

  /contributions/cash/receipts/{receiptNumber}:
    get:
      summary: Tra cứu phiếu thu điện tử theo mã số biên lai (US-09)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: receiptNumber
          in: path
          required: true
          schema:
            type: string
            example: PT-20261029-A1B2C3
      responses:
        '200':
          description: Tra cứu phiếu thu điện tử thành công
        '404':
          description: Không tìm thấy biên lai

  /events/{eventId}/benchmarks:
    post:
      summary: Ban hành định mức giá hiện vật cúng tiến của sự kiện (US-10, Task #72)
      description: |
        Ban tổ chức (HeadOfOrganizer, EventTreasurer) hoặc Trưởng tộc/Admin thiết lập đơn giá định mức
        cho các hiện vật cúng tiến phổ biến (heo quay, mâm xôi, gà luộc, v.v.) trong sự kiện.
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT20261029ABC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventItemBenchmarkRequest'
      responses:
        '201':
          description: Tạo định mức giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEventItemBenchmark'
        '400':
          description: Dữ liệu không hợp lệ hoặc đã tồn tại định mức cho vật phẩm này
        '403':
          description: Không có quyền thiết lập định mức
        '404':
          description: Sự kiện không tồn tại
    get:
      summary: Lấy danh sách định mức giá hiện vật theo sự kiện (US-10, Task #72)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT20261029ABC
      responses:
        '200':
          description: Danh sách định mức giá hiện vật
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Event item benchmarks retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventItemBenchmarkResponse'

  /events/{eventId}/benchmarks/{benchmarkId}:
    delete:
      summary: Xóa định mức giá hiện vật của sự kiện (US-10, Task #72)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT20261029ABC
        - name: benchmarkId
          in: path
          required: true
          schema:
            type: string
            example: BM20261031A1B2C3D4
      responses:
        '200':
          description: Xóa định mức giá thành công
        '403':
          description: Không có quyền xóa định mức
        '404':
          description: Sự kiện hoặc định mức không tồn tại

  /contributions/in-kind:
    post:
      summary: Tiếp nhận hiện vật cúng tiến & quy đổi giá trị tương đương (US-10, Task #72, #74)
      description: |
        Tiếp nhận hiện vật cúng tiến (heo quay, mâm quả, lư hương...), tự động tính giá trị tiền mặt quy đổi tương đương
        theo phương thức BTC Benchmark, Invoice (đối soát thực tế), hoặc Agreement (thỏa thuận),
        đồng thời cấp mã phiếu thu điện tử duy nhất (PT-YYYYMMDD-XXXXX) và khởi tạo trạng thái vòng đời là Pending.
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInKindContributionRequest'
      responses:
        '201':
          description: Tiếp nhận hiện vật và cấp biên lai điện tử thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInKindReceipt'
        '400':
          description: Dữ liệu không hợp lệ hoặc thiếu thông tin quy đổi
        '403':
          description: Không có quyền tiếp nhận hiện vật
        '404':
          description: Sự kiện hoặc thành viên không tồn tại

  /contributions/in-kind/{id}:
    get:
      summary: Xem chi tiết đóng góp hiện vật cúng tiến (US-10, Task #72)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: CTB20261031ABC12345
      responses:
        '200':
          description: Lấy chi tiết hiện vật cúng tiến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInKindContributionDetail'
        '404':
          description: Không tìm thấy hiện vật cúng tiến

  /contributions/in-kind/receipts/{receiptNumber}:
    get:
      summary: Tra cứu phiếu thu điện tử hiện vật theo mã số biên lai (US-10, Task #74)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: receiptNumber
          in: path
          required: true
          schema:
            type: string
            example: PT-20261031-K9L8M7
      responses:
        '200':
          description: Tra cứu phiếu thu điện tử hiện vật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInKindReceipt'
        '404':
          description: Không tìm thấy biên lai

  /contributions/in-kind/{id}/lifecycle:
    put:
      summary: Phân loại vòng đời hiện vật cúng tiến sau sự kiện (US-10, Task #73)
      description: |
        Phân loại hiện vật sau sự kiện:
        - Consumed (Tiêu hao tại cỗ/sự kiện)
        - Returned (Hoàn trả cho người dâng cúng)
        - AddedToCommonAssets (Tự động kết chuyển vào danh mục tài sản chung dòng họ - clan_assets)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: CTB20261031ABC12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessInKindLifecycleRequest'
      responses:
        '200':
          description: Xử lý vòng đời hiện vật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProcessInKindLifecycle'
        '400':
          description: Hiện vật đã được xử lý hoặc dữ liệu vị trí lưu trữ không hợp lệ
        '403':
          description: Không có quyền phân loại vòng đời
        '404':
          description: Không tìm thấy hiện vật

  /contributions/in-kind/events/{eventId}:
    get:
      summary: Danh sách tất cả hiện vật cúng tiến theo sự kiện (US-10, Task #73)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            example: EVT20261029ABC
      responses:
        '200':
          description: Danh sách hiện vật cúng tiến
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Event in-kind contributions retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InKindContributionDetailResponse'

  /clan-assets:
    get:
      summary: Danh sách tài sản tích lũy chung của dòng họ có phân trang & tìm kiếm (US-10, Task #73, #74)
      description: |
        Truy xuất danh mục tài sản lâu bền của dòng họ (đồ thờ, bàn ghế, lư đồng, v.v.),
        hỗ trợ tìm kiếm theo tên tài sản và phân trang.
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            example: "Lư đồng"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách tài sản dòng họ phân trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClanAssetSummary'

  /clan-assets/{id}:
    get:
      summary: Chi tiết tài sản dòng họ (US-10, Task #73)
      tags:
        - Contributions & Fund
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: AST20261031ABC12345
      responses:
        '200':
          description: Chi tiết tài sản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClanAsset'
        '404':
          description: Tài sản không tồn tại

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Nhập JWT Access Token nhận được từ API /auth/login.
        Token tự động đính kèm quyền hạn ROLE_CLAN_HEAD và clanId cho người tạo cây.

  schemas:
    CreateMemberRequest:
      type: object
      description: |
        Payload tạo thành viên. `branchId` KHÔNG nằm trong body (lấy từ path variable).
        `memberId`, `isPlaceholder`, `createdAt` do server sinh và bị bỏ qua nếu client gửi lên.
      required:
        - fullName
        - gender
        - generation
      properties:
        fullName:
          type: string
          maxLength: 100
          description: "`members.full_name` VARCHAR(100) NOT NULL"
          example: Nguyễn Văn An
        dateOfBirth:
          type: string
          format: date
          description: "`members.date_of_birth` DATE, không được ở tương lai"
          example: "1990-05-20"
        gender:
          type: string
          enum: [Male, Female, Other]
          description: "`members.gender` CHECK (Male|Female|Other)"
          example: Male
        generation:
          type: integer
          minimum: 1
          description: "`members.generation` INT NOT NULL CHECK >= 1; không nhỏ hơn `generation_level` của chi/nhánh"
          example: 3
        status:
          type: string
          enum: [Living, Deceased]
          default: Living
          description: "`members.status` VARCHAR(20) NOT NULL DEFAULT 'Living'; bỏ trống thì mặc định Living"
          example: Living
        deathDateLunar:
          type: string
          maxLength: 50
          description: "`members.death_date_lunar` VARCHAR(50)"
          example: "15/08 Âm lịch"

    MemberResponse:
      type: object
      description: Read model của bảng `members`; `branchName` và `clanId` phân giải qua `family_branches`.
      properties:
        memberId:
          type: string
          maxLength: 20
          example: MEMK4F8ZQ1M7XB3QP
        fullName:
          type: string
          example: Nguyễn Văn An
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: "1990-05-20"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: Male
        generation:
          type: integer
          example: 3
        status:
          type: string
          enum: [Living, Deceased]
          example: Living
        deathDateLunar:
          type: string
          nullable: true
          example: "15/08 Âm lịch"
        branchId:
          type: string
          example: BR_CHILD_1
        branchName:
          type: string
          example: Chi Hai
        clanId:
          type: string
          example: CLAN_DEFAULT
        isPlaceholder:
          type: boolean
          description: Luôn `true` với hồ sơ do quản lý tạo (chờ nhận liên kết ở US-18).
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-10-23T15:00:00Z"

    ApiResponseMember:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Member created successfully
        data:
          $ref: '#/components/schemas/MemberResponse'
        timestamp:
          type: string
          format: date-time

    ApiResponseError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Branch not found with ID: BR_CHILD_1 in clan: CLAN_DEFAULT"
        errors:
          type: object
          description: "Chỉ xuất hiện khi `400` do Bean Validation; map `tên trường -> thông điệp`."
          additionalProperties:
            type: string
          example:
            fullName: Full name must not be blank
        timestamp:
          type: string
          format: date-time



    CreateEventItemBenchmarkRequest:
      type: object
      required:
        - itemName
        - unit
        - unitPrice
      properties:
        itemName:
          type: string
          maxLength: 100
          example: Heo quay nguyên con
        unit:
          type: string
          maxLength: 20
          example: Con
        unitPrice:
          type: number
          format: double
          minimum: 0
          example: 3500000
        note:
          type: string
          maxLength: 255
          example: Định mức heo sữa quay giòn bì 12-15kg

    EventItemBenchmarkResponse:
      type: object
      properties:
        benchmarkId:
          type: string
          example: BM20261031A1B2C3D4
        eventId:
          type: string
          example: EVT20261029ABC
        clanId:
          type: string
          example: CLAN_DEFAULT
        itemName:
          type: string
          example: Heo quay nguyên con
        unit:
          type: string
          example: Con
        unitPrice:
          type: number
          format: double
          example: 3500000
        note:
          type: string
          example: Định mức heo sữa quay giòn bì 12-15kg
        createdAt:
          type: string
          format: date-time
          example: "2026-10-31T08:00:00Z"

    ApiResponseEventItemBenchmark:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Event item benchmark created successfully
        data:
          $ref: '#/components/schemas/EventItemBenchmarkResponse'

    RecordInKindContributionRequest:
      type: object
      required:
        - eventId
        - itemName
        - quantity
        - unit
        - conversionMethod
      properties:
        eventId:
          type: string
          example: EVT20261029ABC
        contributorMemberId:
          type: string
          example: MEM01J0001
        externalDonorName:
          type: string
          example: Nguyễn Thị Lan
        externalDonorContact:
          type: string
          example: "0912345678"
        itemName:
          type: string
          maxLength: 100
          example: Đôi đỉnh đồng khảm tam khí
        quantity:
          type: number
          format: double
          minimum: 0.01
          example: 1
        unit:
          type: string
          maxLength: 20
          example: Đôi
        conversionMethod:
          type: string
          enum: [BtcBenchmark, Invoice, Agreement]
          example: Agreement
        convertedMonetaryValue:
          type: number
          format: double
          example: 15000000
        note:
          type: string
          example: Cúng tiến đặt tại gian chính Nhà thờ tổ

    InKindElectronicReceiptResponse:
      type: object
      properties:
        receiptNumber:
          type: string
          example: PT-20261031-K9L8M7
        contributionId:
          type: string
          example: CTB20261031ABC12345
        eventId:
          type: string
          example: EVT20261029ABC
        eventName:
          type: string
          example: Lễ giỗ Tổ họ Nguyễn 2026
        donorName:
          type: string
          example: Nguyễn Văn An
        itemName:
          type: string
          example: Đôi đỉnh đồng khảm tam khí
        quantity:
          type: number
          format: double
          example: 1
        unit:
          type: string
          example: Đôi
        conversionMethod:
          type: string
          enum: [BtcBenchmark, Invoice, Agreement]
          example: Agreement
        convertedMonetaryValue:
          type: number
          format: double
          example: 15000000
        receivedAt:
          type: string
          format: date-time
          example: "2026-10-31T08:30:00Z"
        receivedBy:
          type: string
          example: MEM_TREASURER_1
        processingStatus:
          type: string
          enum: [Pending, Consumed, Returned, AddedToCommonAssets]
          example: Pending
        note:
          type: string
          example: Cúng tiến đặt tại gian chính Nhà thờ tổ

    ApiResponseInKindReceipt:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: In-kind contribution recorded successfully
