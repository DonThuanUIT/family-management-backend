        pageSize:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 1

    ApiResponseClanAssetSummary:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Clan assets retrieved successfully
        data:
          $ref: '#/components/schemas/ClanAssetSummaryResponse'
