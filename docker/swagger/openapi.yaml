        memberId:
          type: string
          example: MEMK4F8ZQ1M7XB3QP
        fullName:
          type: string
          example: Nguyễn Văn Út
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-11-07T09:00:00Z"

