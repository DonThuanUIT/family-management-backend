openapi: 3.0.3
info:
  title: Family Management Fund API (familyfund-api)
  version: 1.0.0
  description: |
    Core RESTful API documentation for Family Management Backend system.
    Supports Family Tree Management, Event Planning & Registration, Advance/Settlement Vouchers,
    Immutable Ledgers (Audit Trail), and Multi-channel Contributions.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Spring Boot Backend Server
paths:
  /auth/register-creator:
    post:
      summary: Đăng ký tài khoản người khởi tạo & tạo dòng họ mới (US-01)
      description: |
        Khởi tạo tài khoản người dùng, tạo một dòng họ mới (Multi-tenant), dựng nhánh gốc (Root Branch)
        của cây phả hệ, tạo hồ sơ Thủy tổ (nếu có) và hồ sơ thành viên người khởi tạo với vai trò ROLE_CLAN_HEAD.
      tags:
        - Authentication
        - Clan & Family Tree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clanName
                - fullName
                - phoneNumber
                - password
                - gender
              properties:
                clanName:
                  type: string
                  example: Dòng họ Nguyễn Văn
                ancestorName:
                  type: string
                  example: Cụ Tổ Nguyễn Văn Khởi
                originLocation:
                  type: string
                  example: Hà Nam, Việt Nam
                establishedYear:
                  type: integer
                  example: 1820
                description:
                  type: string
                  example: Chi họ khởi tổ tại Hà Nam
                fullName:
                  type: string
                  example: Nguyễn Văn An
                phoneNumber:
                  type: string
                  example: "0987654321"
                password:
                  type: string
                  format: password
                  example: SecurePassword123
                gender:
                  type: string
                  enum: [Male, Female, Other]
                  example: Male
                email:
                  type: string
                  format: email
                  example: nguyenvanan@example.com
                dateOfBirth:
                  type: string
                  format: date
                  example: 1985-05-15
                generation:
                  type: integer
                  example: 6
      responses:
        '201':
          description: Đăng ký và khởi tạo dòng họ thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đăng ký người khởi tạo và tạo dòng họ mới thành công
                  data:
                    type: object
                    properties:
                      account:
                        type: object
                        properties:
                          accountId:
                            type: string
                            example: ACC_9A8B7C6D
                          phoneNumber:
                            type: string
                            example: "0987654321"
                          email:
                            type: string
                            example: nguyenvanan@example.com
                          accountStatus:
                            type: string
                            example: Active
                          roles:
                            type: array
                            items:
                              type: string
                            example: [ROLE_CLAN_HEAD]
                          createdAt:
                            type: string
                            format: date-time
                      clan:
                        type: object
                        properties:
                          clanId:
                            type: string
                            example: CLAN_F1E2D3C4
                          clanName:
                            type: string
                            example: Dòng họ Nguyễn Văn
                          ancestorName:
                            type: string
                            example: Cụ Tổ Nguyễn Văn Khởi
                          originLocation:
                            type: string
                            example: Hà Nam, Việt Nam
                          establishedYear:
                            type: integer
                            example: 1820
                          description:
                            type: string
                            example: Chi họ khởi tổ tại Hà Nam
                      member:
                        type: object
                        properties:
                          memberId:
                            type: string
                            example: MEM_4B3A2C1D
                          fullName:
                            type: string
                            example: Nguyễn Văn An
                          gender:
                            type: string
                            example: Male
                          generation:
                            type: integer
                            example: 6
                          dateOfBirth:
                            type: string
                            format: date
                            example: 1985-05-15
                          branchId:
                            type: string
                            example: BR_1234ABCD
        '400':
          description: Dữ liệu không hợp lệ hoặc số điện thoại / email đã tồn tại
  /auth/login:
    post:
      summary: Đăng nhập hệ thống
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginIdentifier
                - password
              properties:
                loginIdentifier:
                  type: string
                  example: admin_hoang
                password:
                  type: string
                  format: password
                  example: Admin@123
      responses:
        '200':
          description: Đăng nhập thành công, trả về JWT Token và thông tin tài khoản
        '401':
          description: Sai thông tin đăng nhập

  /clans:
    get:
      summary: Lấy danh sách dòng họ (Multi-tenant)
      tags:
        - Clan & Family Tree
      responses:
        '200':
          description: Danh sách dòng họ
    post:
      summary: Khởi tạo dòng họ mới
      tags:
        - Clan & Family Tree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clanName
              properties:
                clanName:
                  type: string
                  example: Dòng họ Nguyễn Trọng
                establishedDate:
                  type: string
                  format: date
                  example: 1850-01-01
                inviteCode:
                  type: string
                  example: CLAN-NGUYEN-1850
      responses:
        '201':
          description: Tạo thành công

  /clans/{clanId}/members:
    get:
      summary: Lấy danh sách thành viên trong dòng họ
      tags:
        - Clan & Family Tree
      parameters:
        - name: clanId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách thành viên

  /events:
    get:
      summary: Danh sách sự kiện của dòng họ
      tags:
        - Events & Registration
      parameters:
        - name: clanId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách sự kiện
    post:
      summary: Khởi tạo kế hoạch sự kiện mới
      tags:
        - Events & Registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clanId
                - eventName
                - eventDatetime
                - location
              properties:
                clanId:
                  type: string
                  example: CLAN_NGUYENTRONG
                eventName:
                  type: string
                  example: Giỗ Tổ 2026
                eventDatetime:
                  type: string
                  format: date-time
                  example: "2026-04-26T08:00:00Z"
                location:
                  type: string
                  example: Nhà thờ tổ Chi 1
                estimatedBudget:
                  type: number
                  example: 50000000.00
      responses:
        '201':
          description: Tạo sự kiện thành công

  /events/{eventId}/advance-vouchers:
    post:
      summary: Lập phiếu cấp phát kinh phí tạm ứng (Phân hệ 3)
      tags:
        - Finance & Vouchers
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - taskId
                - recipientMemberId
                - advanceAmount
                - receivedDate
                - settlementDeadline
              properties:
                taskId:
                  type: string
                  example: TASK_001
                recipientMemberId:
                  type: string
                  example: MEM_001
                advanceAmount:
                  type: number
                  example: 5000000.00
                receivedDate:
                  type: string
                  format: date-time
                settlementDeadline:
                  type: string
                  format: date-time
                commitmentNotes:
                  type: string
                  example: Chi phí mua hoa quả, bánh kẹo
      responses:
        '201':
          description: Lập phiếu tạm ứng thành công

  /events/{eventId}/contributions:
    post:
      summary: Tiếp nhận đóng góp / cúng tiến (Tiền mặt hoặc Hiện vật)
      tags:
        - Contributions & Assets
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payerMemberId
                - contributionType
                - memberAllocations
              properties:
                payerMemberId:
                  type: string
                  example: MEM_001
                contributionType:
                  type: string
                  enum: [Cash, InKind]
                  example: Cash
                cashDetail:
                  type: object
                  properties:
                    amount:
                      type: number
                      example: 2000000.00
                    paymentMethod:
                      type: string
                      enum: [Cash, BankTransfer]
                      example: BankTransfer
                    receiptNumber:
                      type: string
                      example: REC-2026-0001
                memberAllocations:
                  type: array
                  items:
                    type: object
                    required:
                      - memberId
                      - recordedAmount
                    properties:
                      memberId:
                        type: string
                        example: MEM_001
                      recordedAmount:
                        type: number
                        example: 2000000.00
      responses:
        '201':
          description: Ghi nhận đóng góp thành công

  /ledger/immutable:
    get:
      summary: Tra cứu Sổ cái Quỹ chung bất biến (Audit Trail NFR-01)
      tags:
        - Finance & Vouchers
      parameters:
        - name: eventId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Danh sách các bút toán sổ cái bất biến

  /invitations/general:
    post:
      summary: Tạo mã mời chung gia phả (US-16)
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetBranchId:
                  type: string
                  example: BRANCH_ROOT
                maxUses:
                  type: integer
                  example: 100
                validityDays:
                  type: integer
                  example: 30
      responses:
        '201':
          description: Tạo mã mời thành công
        '400':
          description: Tham số không hợp lệ
        '403':
          description: Không có quyền (chỉ dành cho ROLE_CLAN_HEAD hoặc ROLE_ADMIN)
    get:
      summary: Lấy danh sách các mã mời chung đang hoạt động
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách mã mời chung

  /invitations/{inviteCode}:
    get:
      summary: Xem chi tiết thông tin mã mời (Public cho trang đón tiếp US-17)
      tags:
        - Invitations & Onboarding
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
            example: 8K9P2X7N
      responses:
        '200':
          description: Thông tin mã mời
        '404':
          description: Mã mời không tồn tại hoặc đã bị vô hiệu hóa

  /invitations/{inviteCode}/deactivate:
    patch:
      summary: Vô hiệu hóa mã mời sớm
      tags:
        - Invitations & Onboarding
      security:
        - BearerAuth: []
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vô hiệu hóa thành công
        '403':
          description: Không có quyền thực hiện

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Nhập JWT Access Token nhận được từ API /auth/login.
        Token tự động đính kèm quyền hạn ROLE_CLAN_HEAD và clanId cho người tạo cây.
